// ── Main App ─────────────────────────────────────────────────────────────────

function App() {
  const draft = loadDraft();
  const [currentUser, setCurrentUser] = useState(loadUser());

  // Warm up Apps Script and Railway on load so first real requests are fast
  useEffect(() => {
    fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'get_queue' }) }).catch(() => {});
    fetch('https://toomey-backend-production.up.railway.app/health').catch(() => {});
  }, []);

  // App update notification — only shown on home screen
  const [updateAvailable, setUpdateAvailable] = useState(!!window.toomeyUpdatePending);
  useEffect(() => {
    const handler = () => setUpdateAvailable(true);
    window.addEventListener('toomey-update-available', handler);
    return () => window.removeEventListener('toomey-update-available', handler);
  }, []);

  // Price list
  const [priceList,        setPriceList]        = useState([]);
  const [priceListLoading, setPriceListLoading] = useState(true);
  useEffect(() => {
    loadPriceList().then(items => { setPriceList(items); setPriceListLoading(false); });
  }, []);

  // Customer list
  const [customerList,        setCustomerList]        = useState([]);
  const [customerListLoading, setCustomerListLoading] = useState(true);
  const [niCustSearch,        setNiCustSearch]        = useState('');
  useEffect(() => {
    loadCustomerList().then(items => { setCustomerList(items); setCustomerListLoading(false); });
  }, []);

  const [step, setStep]       = useState(0);
  const [done, setDone]       = useState(false);
  const [loading, setLoading] = useState(false);
  const [jobType, setJobType]               = useState(null);
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [queueCustomer, setQueueCustomer]   = useState(null);
  const [queueRowIndex, setQueueRowIndex]   = useState(null);

  // Customer
  const [name,    setName]    = useState(draft.name    || "");
  const [address, setAddress] = useState(draft.address || "");
  const [town,    setTown]    = useState(draft.town    || "");
  const [email,   setEmail]   = useState(draft.email   || "");

  // System
  const [pgp,      setPgp]      = useState(draft.pgp      || 0);
  const [mp,       setMp]       = useState(draft.mp       || 0);
  const [pro4,     setPro4]     = useState(draft.pro4     || 0);
  const [drip,     setDrip]     = useState(draft.drip     || 0);
  const [zones,    setZones]    = useState(draft.zones    || 0);
  const [valves,   setValves]   = useState(draft.valves   || 0);
  const [timer,    setTimer]    = useState(draft.timer    || TIMER_OPTIONS[0]);

  // Pricing
  const [price,    setPrice]    = useState(draft.price    || "");
  const [notes,    setNotes]    = useState(draft.notes    || "");
  const [sidewalk, setSidewalk] = useState(draft.sidewalk || "");
  const [other,    setOther]    = useState(draft.other    || "");

  const totalHeads = pgp + mp + pro4;
  const proposalDate = today();

  // Pricing logic: auto-calculate but allow manual override
  const [priceOverride, setPriceOverride] = useState(draft.priceOverride || "");
  
  function calculatePrice() {
    let headsCost = 0;
    if (totalHeads <= 15) {
      headsCost = 2650;
    } else if (totalHeads <= 30) {
      headsCost = 3635;
    } else {
      headsCost = totalHeads * 125;
    }
    
    const dripCost = drip * 1000;
    return headsCost + dripCost;
  }
  
  const autoPrice = calculatePrice();
  const displayPrice = priceOverride || autoPrice.toLocaleString();
  
  function getPriceBreakdown() {
    let parts = [];
    
    if (totalHeads > 0) {
      if (totalHeads <= 15) {
        parts.push(`${totalHeads} heads: $2,650 (base)`);
      } else if (totalHeads <= 30) {
        parts.push(`${totalHeads} heads: $3,635 (16-30 tier)`);
      } else {
        parts.push(`${totalHeads} heads × $125 = $${(totalHeads * 125).toLocaleString()}`);
      }
    }
    
    if (drip > 0) {
      parts.push(`${drip} drip zone${drip > 1 ? 's' : ''} × $1,000 = $${(drip * 1000).toLocaleString()}`);
    }
    
    return parts.join(' + ');
  }

  // Auto-save draft whenever state changes
  useEffect(() => {
    saveDraft({ name, address, town, email, pgp, mp, pro4, drip, zones, valves, timer, price, priceOverride, notes, sidewalk, other });
  }, [name, address, town, email, pgp, mp, pro4, drip, zones, valves, timer, price, priceOverride, notes, sidewalk, other]);

  const canNext = [
    name.trim().length > 0 && address.trim().length > 0,
    totalHeads > 0 || drip > 0,
    displayPrice.length > 0,
    true,
  ];

  function reset() {
    clearDraft();
    setStep(0); setDone(false); setJobType(null); setSelectedCustomer(null);
    setName(""); setAddress(""); setTown(""); setEmail("");
    setPgp(0); setMp(0); setPro4(0);
    setDrip(0); setZones(0); setValves(0);
    setTimer(TIMER_OPTIONS[0]);
    setPrice(""); setPriceOverride(""); setNotes(""); setSidewalk(""); setOther("");
    setCurrentJobId(null);
    setNiPdfBase64(null);
    setNiPdfStorageUrl(null);
  }

  const [pdfId, setPdfId] = useState(null);
  const [niPdfBase64, setNiPdfBase64] = useState(null);
  const [niPdfStorageUrl, setNiPdfStorageUrl] = useState(null);
  const [niStorageUploadFailed, setNiStorageUploadFailed] = useState(false);
  const [retryingUpload, setRetryingUpload] = useState(false);
  const [sendingEmail, setSendingEmail] = useState(false);
  const [customMessage, setCustomMessage] = useState("");
  const [currentJobId, setCurrentJobId] = useState(null);
  const [installAcceptUrl, setInstallAcceptUrl] = useState('');
  const [installDriveUrl, setInstallDriveUrl] = useState('');

  async function generate() {
    setLoading(true);
    const jobId = currentJobId || `install_${Date.now()}`;
    if (!currentJobId) setCurrentJobId(jobId);

    const estimateData = {
      customer_name: name,
      customer_address: address,
      customer_town: town,
      customer_email: email,
      date: proposalDate,
      hunter_pgp_ultra: String(pgp),
      mp_rotor_nozzle: String(mp),
      hunter_pro4_spray: String(pro4),
      drip_zones: String(drip),
      number_of_zones: String(zones),
      irritrol_valves: String(valves),
      hydrawise_timer: timer,
      price: displayPrice,
      notes: notes,
      sidewalk_strip: sidewalk,
      other_addon: other,
      // User info for email sending
      prepared_by_name: currentUser?.name || "W.L. Toomey Irrigation",
      prepared_by_email: currentUser?.email || "",
      smtp_user: currentUser?.email || "",
      smtp_password: currentUser?.smtp_password || ""
    };
    
    try {
      const BACKEND_URL = 'https://toomey-backend-production.up.railway.app';

      const response = await fetch(`${BACKEND_URL}/generate-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(estimateData)
      });

      const result = await response.json();

      if (result.success) {
        setPdfId(result.pdf_id);
        // Upload PDF to Firebase Storage for a permanent preview URL (works on iPad)
        if (result.pdf_base64 && window.TFB) {
          const storageUrl = await window.TFB.uploadPdf(result.pdf_base64, `proposals/${jobId}.pdf`);
          if (storageUrl) {
            setNiPdfStorageUrl(storageUrl);
          } else {
            // Upload failed — flag it so the done screen can show a retry option
            setNiStorageUploadFailed(true);
          }
        }
        setNiPdfBase64(result.pdf_base64 || null);
      } else {
        alert('Failed to generate PDF: ' + (result.error || 'Unknown error'));
        setLoading(false);
        return;
      }
    } catch (err) {
      console.error('PDF generation failed:', err);
      alert('Could not reach the PDF server. Please check your connection and try again.');
      setLoading(false);
      return;
    }

    setLoading(false);
    setDone(true);

    // Save to Firebase
    if (window.TFB) {
      window.TFB.save({
        jobType: 'new_installation',
        status: 'pending',
        customer: { name, address, email },
        system: { pgp, mp, pro4, drip, zones, valves, timer },
        addOns: { sidewalk, other },
        notes,
        price: displayPrice,
        preparedBy: currentUser?.name || '',
        preparedByEmail: currentUser?.email || '',
      }, jobId);
    }

    // Sync directly to Google Sheets via Apps Script (no Railway middleman)
    try {
      const rawPrice = String(displayPrice).replace(/,/g,'');
      const syncResp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action:          'submit_proposal',
          jobType:         'new_installation',
          firebaseId:      jobId,
          customerName:    name,
          customerAddress: address || '',
          customerTown:    town   || '',
          customerPhone:   '',
          customerEmail:   email || '',
          preparedBy:      currentUser?.name || '',
          grandTotal:      rawPrice,
          notes,
          pgp, mp, pro4, drip, zones,
          addOnNotes: [sidewalk, other].filter(Boolean).join(' | '),
        })
      });
      const syncResult = await syncResp.json().catch(() => ({}));
      if (syncResult.accept_url) setInstallAcceptUrl(syncResult.accept_url);
      showToast('✅ Synced to Google Sheets');
      // Only delete the queue row after a successful Sheets sync
      if (queueRowIndex) {
        fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'update_queue_status', rowIndex: queueRowIndex, status:'Completed' }) }).catch(() => {});
        setQueueRowIndex(null);
      }
    } catch(e) { console.warn('Sheets sync failed:', e); showToast('⚠️ Sheet sync failed — check connection', 'error'); }
  }

  async function sendToClient() {
    if (!niPdfBase64 && !pdfId) return;

    setSendingEmail(true);

    try {
      const BACKEND_URL = 'https://toomey-backend-production.up.railway.app';
      let response;

      if (niPdfBase64) {
        // Preferred path: send base64 directly — does not depend on Railway temp storage
        response = await fetch(`${BACKEND_URL}/send-job-pdf`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pdf_base64:        niPdfBase64,
            to_email:          email,
            customer_name:     name,
            customer_address:  address || '',
            job_type:          'new_installation',
            job_type_label:    'New Installation',
            firebase_id:       currentJobId || '',
            prepared_by_name:  currentUser?.name  || '',
            prepared_by_email: currentUser?.email || '',
            smtp_password:     currentUser?.smtp_password || '',
            message:           customMessage.trim(),
            cc_office:         true,
            accept_url:        installAcceptUrl || '',
          })
        });
      } else {
        // Fallback: use the pdfId stored on Railway (may fail if Railway restarted)
        response = await fetch(`${BACKEND_URL}/send-pdf/${pdfId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: customMessage.trim(), accept_url: installAcceptUrl || '' })
        });
      }

      const text = await response.text();
      let result;
      try { result = JSON.parse(text); } catch(e) { result = { error: text.slice(0, 300) }; }

      if (result.success) {
        if (result.driveUrl) setInstallDriveUrl(result.driveUrl);
        alert(`✅ Proposal sent to ${email}!`);
        setCustomMessage("");
      } else {
        alert('Email error: ' + (result.error || 'Unknown error'));
      }
    } catch (err) {
      alert('Network error: ' + err.message);
    }

    setSendingEmail(false);
  }

  async function retryStorageUpload() {
    if (!niPdfBase64 || !currentJobId) return;
    setRetryingUpload(true);
    const storageUrl = await window.TFB.uploadPdf(niPdfBase64, `proposals/${currentJobId}.pdf`);
    if (storageUrl) {
      setNiPdfStorageUrl(storageUrl);
      setNiStorageUploadFailed(false);
    } else {
      alert('Upload still failing. Check your internet connection and try again.');
    }
    setRetryingUpload(false);
  }

  // ── Done screen ────────────────────────────────────────────────────────────
  if (done) {
    return (
      <div id="app-inner">
        <div className="brand">
          <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:8}} alt="" /></div>
          <div>
            <div className="brand-sub">W.L. Toomey Irrigation</div>
            <div className="brand-title">Estimate Builder</div>
          </div>
        </div>

        <div className="card">
          <div className="done-header">
            <div className="done-emoji">✅</div>
            <div className="done-title">Proposal Complete!</div>
            <div className="done-sub">W.L. Toomey Irrigation · {proposalDate}</div>
          </div>
          <div className="card-body">
            <div className="customer-banner">
              <div className="customer-name">{name}</div>
              <div className="customer-address">{address}</div>
              {email && <div className="customer-email">{email}</div>}
              <div className="customer-date">Prepared: {proposalDate}</div>
            </div>

            <InnerCard title="🌀 System">
              <Row label="Hunter PGP-Ultra Rotary" value={pgp  > 0 ? `${pgp} heads`  : null} />
              <Row label="Rotor Streamer"          value={mp   > 0 ? `${mp} heads`   : null} />
              <Row label="Hunter Pro-4 Spray"      value={pro4 > 0 ? `${pro4} heads` : null} />
              <Row label="Total Heads"             value={totalHeads} accent />
              <Row label="Drip Zones"              value={drip   > 0 ? drip   : null} />
              <Row label="# of Zones"              value={zones  > 0 ? zones  : null} />
              <Row label="Irritrol Valves"         value={valves > 0 ? valves : null} />
              <Row label="Controller"              value={timer} />
            </InnerCard>

            {(sidewalk || other) && (
              <InnerCard title="✨ Add-Ons">
                <Row label="Sidewalk Strip" value={sidewalk} />
                <Row label="Other"          value={other} />
              </InnerCard>
            )}

            {notes && (
              <InnerCard title="📝 Notes">
                <p style={{margin:0,fontSize:15,color:"#475569",lineHeight:1.6}}>{notes}</p>
              </InnerCard>
            )}

            <div className="price-callout">
              <div>
                <div className="price-label">Total Price</div>
                <div className="price-val">${displayPrice}</div>
                <div className="price-note">Excl. plumbing / backflow</div>
              </div>
              <span style={{fontSize:48}}>💰</span>
            </div>

            {/* Preview & Send buttons */}
            {(niPdfStorageUrl || pdfId) ? (
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {/* Storage upload failed banner — shown when Firebase upload didn't work */}
                {niStorageUploadFailed && !niPdfStorageUrl && (
                  <div style={{background:'#fef3c7',border:'1.5px solid #f59e0b',borderRadius:12,padding:'12px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                    <span style={{fontSize:14,color:'#92400e',fontWeight:600}}>Preview link unavailable — upload failed</span>
                    <button onClick={retryStorageUpload} disabled={retryingUpload}
                      style={{padding:'8px 14px',borderRadius:8,border:'none',background:'#f59e0b',color:'white',fontWeight:700,fontSize:13,cursor:'pointer',whiteSpace:'nowrap'}}>
                      {retryingUpload ? 'Retrying…' : 'Retry Upload'}
                    </button>
                  </div>
                )}
                <div style={{display:'flex',gap:10}}>
                  {niPdfStorageUrl ? (
                    <a
                      href={niPdfStorageUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{
                        flex:1,display:'block',padding:'16px 10px',borderRadius:14,
                        background:'linear-gradient(135deg,#1a3a6b,#2563eb)',
                        color:'white',textAlign:'center',fontSize:16,fontWeight:700,
                        textDecoration:'none',boxShadow:'0 4px 16px rgba(37,99,235,0.35)'
                      }}
                    >
                      📄 Preview
                    </a>
                  ) : (
                    <button disabled
                      style={{
                        flex:1,padding:'16px 10px',borderRadius:14,
                        background:'#cbd5e1',color:'white',textAlign:'center',fontSize:16,fontWeight:700,
                        border:'none',cursor:'default'
                      }}
                    >
                      📄 Preview
                    </button>
                  )}
                  <a
                    href={niPdfStorageUrl || '#'}
                    download={niPdfStorageUrl ? undefined : undefined}
                    style={{
                      flex:1,display:'block',padding:'16px 10px',borderRadius:14,
                      background: niPdfStorageUrl ? 'linear-gradient(135deg,#166534,#16a34a)' : '#cbd5e1',
                      color:'white',textAlign:'center',fontSize:16,fontWeight:700,
                      textDecoration:'none',boxShadow: niPdfStorageUrl ? '0 4px 16px rgba(22,163,74,0.35)' : 'none',
                      pointerEvents: niPdfStorageUrl ? 'auto' : 'none'
                    }}
                  >
                    ⬇ Download
                  </a>
                </div>
                
                {email && (
                  <>
                    {/* Custom message input */}
                    <div style={{background:'#f8fafc',borderRadius:14,padding:'16px 18px'}}>
                      <label style={{fontSize:12,fontWeight:700,color:'#475569',letterSpacing:'0.04em',textTransform:'uppercase',display:'block',marginBottom:8}}>
                        ✏️ Add Personal Note (Optional)
                      </label>
                      <textarea
                        value={customMessage}
                        onChange={e => setCustomMessage(e.target.value)}
                        placeholder="e.g., Great meeting you today! Looking forward to working with you."
                        rows={3}
                        style={{
                          width:'100%',padding:'12px 14px',border:'1.5px solid #e2e8f0',
                          borderRadius:10,fontSize:15,fontFamily:'inherit',
                          background:'white',color:'#1e293b',outline:'none',
                          resize:'vertical',boxSizing:'border-box'
                        }}
                      />
                      <div style={{fontSize:12,color:'#64748b',marginTop:6}}>
                        This will be added to the email before sending.
                      </div>
                    </div>
                    
                    <button
                      onClick={sendToClient}
                      disabled={sendingEmail}
                      style={{
                        padding:'16px 20px',borderRadius:14,border:'2px solid #10b981',
                        background:'white',color:'#10b981',fontSize:17,fontWeight:700,
                        cursor:sendingEmail?'default':'pointer',
                        opacity:sendingEmail?0.6:1
                      }}
                    >
                      {sendingEmail ? '📧 Sending...' : `📧 Send to ${name}`}
                    </button>
                    {installDriveUrl && (
                      <a href={installDriveUrl} target="_blank" rel="noopener noreferrer"
                        style={{display:'block',padding:'14px',borderRadius:12,background:'#eff6ff',border:'1.5px solid #2563eb',color:'#2563eb',textAlign:'center',fontWeight:700,fontSize:15,textDecoration:'none'}}>
                        📄 Open PDF in Drive
                      </a>
                    )}
                  </>
                )}
                
                {!email && (
                  <div className="banner-yellow">
                    ⚠️ No customer email provided — cannot auto-send proposal. Preview PDF above and email manually.
                  </div>
                )}
              </div>
            ) : (
              <div className="banner-blue">
                <strong>⚙️ Backend Setup Required:</strong> Deploy the backend server to enable PDF generation. See <code>DEPLOY.md</code> in the backend folder.
              </div>
            )}
          </div>
        </div>

        <div className="nav-bar">
          <button className="nav-btn-back" onClick={() => { setDone(false); setStep(1); }}>← Edit</button>
          <button className="nav-btn-primary" onClick={reset}>+ New Estimate</button>
        </div>
      </div>
    );
  }

  // ── User selection screen ──────────────────────────────────────────────────
  if (!currentUser) {
    return (
      <div id="app-inner">
        <div className="brand">
          <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:8}} alt="" /></div>
          <div>
            <div className="brand-sub">W.L. Toomey Irrigation</div>
            <div className="brand-title">Estimate Builder</div>
          </div>
        </div>

        <div className="card">
          <div className="card-header" style={{textAlign:'center',padding:'32px 24px'}}>
            <div style={{fontSize:22,fontWeight:700,color:'white',marginBottom:6}}>Who's Using the App?</div>
            <div style={{fontSize:14,opacity:0.8,color:'white'}}>Select your name to continue</div>
          </div>
          <div className="card-body">
            {TEAM_MEMBERS.map((member, i) => (
              <div
                key={i}
                onClick={() => {
                  // Prompt for email password
                  const password = prompt(`Enter your email password for ${member.email}:\n\n(This is stored locally on your iPad only)`);
                  if (password) {
                    const user = { ...member, smtp_password: password };
                    saveUser(user);
                    setCurrentUser(user);
                  }
                }}
                style={{
                  background:'#f8fafc',borderRadius:16,padding:'20px 24px',
                  cursor:'pointer',border:'2px solid #e2e8f0',
                  marginBottom:12,transition:'all 0.2s',
                  WebkitTapHighlightColor:'transparent'
                }}
                onMouseEnter={e => {e.target.style.borderColor='#2563eb'; e.target.style.background='#eff6ff';}}
                onMouseLeave={e => {e.target.style.borderColor='#e2e8f0'; e.target.style.background='#f8fafc';}}
              >
                <div style={{fontSize:18,fontWeight:700,color:'#1a3a6b',marginBottom:4}}>{member.name}</div>
                <div style={{fontSize:14,color:'#64748b'}}>{member.title}</div>
                <div style={{fontSize:13,color:'#94a3b8',marginTop:4}}>{member.email}</div>
              </div>
            ))}
            
            <div style={{marginTop:24,padding:16,background:'#fffbeb',borderRadius:12,border:'1px solid #fde68a'}}>
              <p style={{margin:0,fontSize:13,color:'#92400e',lineHeight:1.6}}>
                <strong>🔒 Your password is stored securely on this iPad only.</strong> It's never sent anywhere except directly to your email provider when sending proposals.
              </p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── Home screen ─────────────────────────────────────────────────────────────
  if (!jobType) {
    return (
      <HomeScreen
        currentUser={currentUser}
        queueCustomer={queueCustomer}
        onClearQueue={() => setQueueCustomer(null)}
        onSelect={(jt) => {
          if (jt === 'estimates_queue' || jt === 'past_proposals') { setJobType(jt); return; }
          if (queueCustomer) {
            if (jt === 'new_installation') {
              setName(queueCustomer.name || '');
              setAddress(queueCustomer.address || '');
              setTown(queueCustomer.town || '');
              setEmail(queueCustomer.email || '');
            } else {
              setSelectedCustomer(queueCustomer);
            }
            setQueueCustomer(null);
          }
          setJobType(jt);
        }}
        onSwitchUser={() => { clearUser(); setCurrentUser(null); }}
        updateAvailable={updateAvailable}
      />
    );
  }

  // ── Estimates Queue screen ────────────────────────────────────────────────────
  if (jobType === 'estimates_queue') {
    return (
      <EstimatesQueueScreen
        onBack={() => setJobType(null)}
        onStartEstimate={(customer) => {
          // jobType is already validated/normalized at button level (null if unknown)
          const jt = customer.jobType;
          setQueueRowIndex(customer.rowIndex || null);
          if (jt) {
            if (jt === 'new_installation') {
              setName(customer.name || '');
              setAddress(customer.address || '');
              setTown(customer.town || '');
              setEmail(customer.email || '');
            } else {
              setSelectedCustomer(customer);
            }
            setJobType(jt);
          } else {
            setQueueCustomer(customer);
            setJobType(null);
          }
        }}
      />
    );
  }

  // ── Past Proposals screen ─────────────────────────────────────────────────────
  if (jobType === 'past_proposals') {
    return <PastProposalsScreen onBack={() => setJobType(null)} onEdit={(summary) => {
      setCurrentJobId(summary.firebaseId || null);
      setName(summary.customerName || '');
      setAddress(summary.address || '');
      setTown(summary.town || '');
      setEmail(summary.email || '');
      setPgp(summary.pgp || 0);
      setMp(summary.mp || 0);
      setPro4(summary.pro4 || 0);
      setDrip(summary.drip || 0);
      setZones(summary.zones || 0);
      setNotes(summary.notes || '');
      setStep(0);
      setDone(false);
      setJobType('new_installation');
    }} />;
  }

  // ── Dashboard screen ──────────────────────────────────────────────────────────
  if (jobType === 'dashboard') {
    return <DashboardScreen onBack={() => setJobType(null)} />;
  }

  // ── New job types: customer select then job flow ──────────────────────────────
  if (jobType !== 'new_installation') {
    if (!selectedCustomer) {
      return (
        <CustomerSelect
          jobType={jobType}
          onSelect={c => setSelectedCustomer(c)}
          onBack={() => setJobType(null)}
          customerList={customerList}
          customerListLoading={customerListLoading}
        />
      );
    }
    if (jobType === 'revamp' || jobType === 'service_call' || jobType === 'system_recommendations') {
      return (
        <JobFlow
          jobType={jobType}
          customer={selectedCustomer}
          onBack={() => setSelectedCustomer(null)}
          onHome={() => { setJobType(null); setSelectedCustomer(null); }}
          currentUser={currentUser}
          queueRowIndex={queueRowIndex}
          priceList={priceList}
          priceListLoading={priceListLoading}
          onQueueComplete={() => {
            if (queueRowIndex) {
              fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'update_queue_status', rowIndex: queueRowIndex, status:'Completed' }) }).catch(() => {});
              setQueueRowIndex(null);
            }
          }}
        />
      );
    }
    return (
      <JobPlaceholder
        jobType={jobType}
        customer={selectedCustomer}
        onBack={() => setSelectedCustomer(null)}
      />
    );
  }

  // ── Main form ──────────────────────────────────────────────────────────────
  return (
    <div id="app-inner">
      {/* User indicator in brand bar */}
      <div className="brand">
        <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:8}} alt="" /></div>
        <div style={{flex:1}}>
          <div className="brand-sub">W.L. Toomey Irrigation</div>
          <div className="brand-title">Estimate Builder</div>
        </div>
        <button
          onClick={() => {
            if (confirm(`Switch user?\n\nCurrently: ${currentUser.name}`)) {
              clearUser();
              setCurrentUser(null);
            }
          }}
          style={{
            padding:'8px 14px',borderRadius:10,border:'1.5px solid rgba(255,255,255,0.3)',
            background:'rgba(255,255,255,0.1)',color:'white',fontSize:12,fontWeight:600,
            cursor:'pointer',WebkitTapHighlightColor:'transparent'
          }}
        >
          {currentUser.name.split(' ')[0]} ▾
        </button>
      </div>

      <div className="card">
        <div className="card-header">
          <StepBar step={step} />
        </div>

        <div className="card-body">

          {/* ── Step 0: Customer ─────────────────────────────────────────── */}
          {step === 0 && <>
            <div>
              <div className="section-title">Customer Information</div>
              <div className="section-sub">Appears on the proposal cover page.</div>
            </div>
            {/* Existing customer search */}
            {(() => {
              const q = niCustSearch.trim();
              const results = q.length >= 2
                ? customerList.filter(c => c.name.toLowerCase().includes(q.toLowerCase()) || (c.address||'').toLowerCase().includes(q.toLowerCase())).slice(0, 20)
                : [];
              return (
                <div style={{marginBottom:14}}>
                  <input
                    value={niCustSearch}
                    onChange={e => setNiCustSearch(e.target.value)}
                    placeholder="🔍 Find existing customer…"
                    style={{width:'100%',padding:'11px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:15,fontFamily:'inherit',boxSizing:'border-box'}}
                  />
                  {results.length > 0 && (
                    <div style={{border:'1.5px solid #e2e8f0',borderRadius:10,marginTop:4,maxHeight:180,overflowY:'auto',background:'white',boxShadow:'0 4px 12px rgba(0,0,0,0.08)'}}>
                      {results.map((c,i) => (
                        <div key={c.id||i}
                          onClick={() => { setName(c.name||''); setAddress(c.address||''); setTown(c.town||''); setEmail(c.email||''); setNiCustSearch(''); }}
                          style={{padding:'10px 14px',borderBottom:'1px solid #f1f5f9',cursor:'pointer',WebkitTapHighlightColor:'transparent'}}
                          onTouchStart={e=>e.currentTarget.style.background='#eff6ff'}
                          onTouchEnd={e=>e.currentTarget.style.background='white'}
                        >
                          <div style={{fontSize:14,fontWeight:600,color:'#1a3a6b'}}>{c.name}</div>
                          {c.address && <div style={{fontSize:12,color:'#64748b'}}>{c.address}{c.town?', '+c.town:''}</div>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}
            <Field label="Customer Name"            value={name}    onChange={setName}    placeholder="John & Jane Smith"                   icon="👤" />
            <AddressField label="Street Address"     value={address} onChange={setAddress} placeholder="123 Oak Street" icon="🏡" />
            <Field label="Town"                     value={town}    onChange={setTown}    placeholder="Lexington"         icon="📍" />
            <Field label="Email Address (optional)" value={email}   onChange={setEmail}   placeholder="john@example.com" icon="✉️" type="email" />
            <div className="banner-date">
              <span style={{fontSize:22}}>📅</span>
              <div>
                <div className="banner-date-label">Proposal Date</div>
                <div className="banner-date-val">{proposalDate}</div>
              </div>
            </div>
            {!canNext[0] && <p className="hint">Name and address required to continue</p>}
          </>}

          {/* ── Step 1: System ───────────────────────────────────────────── */}
          {step === 1 && <>
            <div>
              <div className="section-title">System Specifications</div>
              <div className="section-sub">Tap +/− to set quantities for each component.</div>
            </div>
            <InnerCard title="🌀 Spray & Rotary Heads">
              <Stepper label="Hunter PGP-Ultra Rotary Heads" value={pgp}  onChange={setPgp}  icon="🔵" />
              <Stepper label="Rotor Streamer Heads"          value={mp}   onChange={setMp}   icon="🟢" />
              <Stepper label="Hunter Pro-4 Spray Heads"      value={pro4} onChange={setPro4} icon="🟡" />
              <div className="total-pill">
                <span className="total-pill-label">Total Heads</span>
                <span className="total-pill-val">{totalHeads}</span>
              </div>
            </InnerCard>
            <InnerCard title="🔧 Zones & Valves">
              <Stepper label="Drip Zones"          value={drip}   onChange={setDrip}   icon="💧" />
              <Stepper label="Number of Zones"     value={zones}  onChange={setZones}  icon="🗺" />
              <Stepper label="Irritrol 2400T Valves" value={valves} onChange={setValves} icon="🔩" />
            </InnerCard>
            <InnerCard title="📡 Controller">
              <SelectField label="Controller Model" value={timer} onChange={setTimer} options={TIMER_OPTIONS} />
            </InnerCard>
            {!canNext[1] && <p className="hint">Add at least one head or drip zone to continue</p>}
          </>}

          {/* ── Step 2: Add-Ons & Price ──────────────────────────────────── */}
          {step === 2 && <>
            <div>
              <div className="section-title">Add-Ons & Pricing</div>
              <div className="section-sub">Auto-calculated based on system specs. You can override if needed.</div>
            </div>
            <InnerCard title="💰 Proposal Price">
              {/* Show auto-calculated price */}
              <div style={{background:"#f0f9ff",borderRadius:12,padding:"14px 16px",marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#0369a1",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>
                  Auto-Calculated Price
                </div>
                <div style={{fontSize:28,fontWeight:700,color:"#0c4a6e",fontFamily:"Georgia,serif",marginBottom:6}}>
                  ${autoPrice.toLocaleString()}
                </div>
                {(totalHeads > 0 || drip > 0) && (
                  <div style={{fontSize:13,color:"#0369a1",lineHeight:1.5}}>
                    {getPriceBreakdown()}
                  </div>
                )}
              </div>
              
              {/* Override field */}
              <Field 
                label="Override Price (optional - leave blank to use auto-calculated)" 
                value={priceOverride} 
                onChange={setPriceOverride} 
                placeholder={`Auto: ${autoPrice.toLocaleString()}`}
                icon="✏️" 
              />
              <div className="banner-yellow">Plumbing / backflow preventer is billed separately per local code requirements.</div>
            </InnerCard>
            <InnerCard title="✨ Optional Add-Ons">
              <Field label="Sidewalk Strip" value={sidewalk} onChange={setSidewalk} placeholder="e.g. 6 spray heads – $450"      icon="🚶" />
              <Field label="Other Add-On"   value={other}    onChange={setOther}    placeholder="e.g. Rain/freeze sensor – $150" icon="🌧" />
            </InnerCard>
            <InnerCard title="📝 Notes">
              <AreaField label="Additional Notes" value={notes} onChange={setNotes} placeholder="e.g. Zone 1–3 front lawn, Zone 4–5 backyard..." icon="📋" />
            </InnerCard>
          </>}

          {/* ── Step 3: Review ───────────────────────────────────────────── */}
          {step === 3 && <>
            <div>
              <div className="section-title">Review Estimate</div>
              <div className="section-sub">Confirm before generating the proposal.</div>
            </div>
            <InnerCard title="👤 Customer">
              <Row label="Name"    value={name}           accent />
              <Row label="Address" value={address} />
              <Row label="Email"   value={email || "—"} />
              <Row label="Date"    value={proposalDate} />
            </InnerCard>
            <InnerCard title="🌀 System">
              <Row label="Hunter PGP-Ultra Rotary" value={pgp   > 0 ? pgp   : null} />
              <Row label="Rotor Streamer"          value={mp    > 0 ? mp    : null} />
              <Row label="Hunter Pro-4 Spray"      value={pro4  > 0 ? pro4  : null} />
              <Row label="Total Heads"             value={totalHeads} accent />
              <Row label="Drip Zones"              value={drip   > 0 ? drip   : null} />
              <Row label="# of Zones"              value={zones  > 0 ? zones  : null} />
              <Row label="Irritrol Valves"         value={valves > 0 ? valves : null} />
              <Row label="Controller"              value={timer} />
            </InnerCard>
            {(sidewalk || other || notes) && (
              <InnerCard title="✨ Add-Ons & Notes">
                <Row label="Sidewalk Strip" value={sidewalk} />
                <Row label="Other"          value={other} />
                {notes && <p style={{margin:0,paddingTop:8,fontSize:15,color:"#475569",lineHeight:1.6}}>{notes}</p>}
              </InnerCard>
            )}
            <div className="price-callout">
              <div>
                <div className="price-label">Total Price</div>
                <div className="price-val">${displayPrice}</div>
                <div className="price-note">Excludes plumbing</div>
              </div>
              <span style={{fontSize:50}}>💧</span>
            </div>
          </>}

        </div>{/* card-body */}
      </div>{/* card */}

      {/* ── Sticky bottom nav ───────────────────────────────────────────────── */}
      <div className="nav-bar">
        {step > 0
          ? <button className="nav-btn-back" onClick={() => setStep(s => s - 1)}>← Back</button>
          : <button className="nav-btn-back" onClick={() => setJobType(null)}>⌂ Home</button>
        }
        {step < 3
          ? <button className="nav-btn-primary" disabled={!canNext[step]} onClick={() => { if (canNext[step]) setStep(s => s + 1); }}>
              Continue →
            </button>
          : <button className="nav-btn-primary" disabled={loading} onClick={generate}>
              {loading ? "⏳  Generating…" : "📄  Generate Proposal"}
            </button>
        }
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<!-- Register service worker + auto-update banner -->
<script>
  const APP_VERSION = "2026.03.16.1";

  // Signal React that an update is available — only shown on home screen
  function showUpdateBanner() {
    window.toomeyUpdatePending = true;
    window.dispatchEvent(new CustomEvent('toomey-update-available'));
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        // Check for updates every 5 minutes
        setInterval(() => reg.update(), 5 * 60 * 1000);

        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        });
      }).catch(() => {});

      // Also check version.json every 5 minutes as a fallback
      function checkVersion() {
        fetch('./version.json?t=' + Date.now())
          .then(r => r.json())
          .then(data => {
            if (data.version && data.version !== APP_VERSION) showUpdateBanner();
          }).catch(() => {});
      }
      setInterval(checkVersion, 5 * 60 * 1000);
      setTimeout(checkVersion, 10000); // first check after 10s
    });
  }
</script>
</body>
</html>
