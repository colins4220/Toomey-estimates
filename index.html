      </div>
      <div className="nav-bar">
        <button className="nav-btn-primary" onClick={onBack}>← Back to Home</button>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────

function App() {
  const draft = loadDraft();
  const [currentUser, setCurrentUser] = useState(loadUser());

  const [step, setStep]       = useState(0);
  const [done, setDone]       = useState(false);
  const [loading, setLoading] = useState(false);
  const [jobType, setJobType]               = useState(null);
  const [selectedCustomer, setSelectedCustomer] = useState(null);

  // Customer
  const [name,    setName]    = useState(draft.name    || "");
  const [address, setAddress] = useState(draft.address || "");
  const [email,   setEmail]   = useState(draft.email   || "");

  // System
  const [pgp,      setPgp]      = useState(draft.pgp      || 0);
  const [mp,       setMp]       = useState(draft.mp       || 0);
  const [pro4,     setPro4]     = useState(draft.pro4     || 0);
  const [drip,     setDrip]     = useState(draft.drip     || 0);
  const [zones,    setZones]    = useState(draft.zones    || 0);
  const [valves,   setValves]   = useState(draft.valves   || 0);
  const [timer,    setTimer]    = useState(draft.timer    || TIMER_OPTIONS[0]);

  // Pricing
  const [price,    setPrice]    = useState(draft.price    || "");
  const [notes,    setNotes]    = useState(draft.notes    || "");
  const [sidewalk, setSidewalk] = useState(draft.sidewalk || "");
  const [other,    setOther]    = useState(draft.other    || "");

  const totalHeads = pgp + mp + pro4;
  const proposalDate = today();

  // Pricing logic: auto-calculate but allow manual override
  const [priceOverride, setPriceOverride] = useState(draft.priceOverride || "");
  
  function calculatePrice() {
    let headsCost = 0;
    if (totalHeads <= 15) {
      headsCost = 2650;
    } else if (totalHeads <= 30) {
      headsCost = 3635;
    } else {
      headsCost = totalHeads * 125;
    }
    
    const dripCost = drip * 1000;
    return headsCost + dripCost;
  }
  
  const autoPrice = calculatePrice();
  const displayPrice = priceOverride || autoPrice.toLocaleString();
  
  function getPriceBreakdown() {
    let parts = [];
    
    if (totalHeads > 0) {
      if (totalHeads <= 15) {
        parts.push(`${totalHeads} heads: $2,650 (base)`);
      } else if (totalHeads <= 30) {
        parts.push(`${totalHeads} heads: $3,635 (16-30 tier)`);
      } else {
        parts.push(`${totalHeads} heads × $125 = $${(totalHeads * 125).toLocaleString()}`);
      }
    }
    
    if (drip > 0) {
      parts.push(`${drip} drip zone${drip > 1 ? 's' : ''} × $1,000 = $${(drip * 1000).toLocaleString()}`);
    }
    
    return parts.join(' + ');
  }

  // Auto-save draft whenever state changes
  useEffect(() => {
    saveDraft({ name, address, email, pgp, mp, pro4, drip, zones, valves, timer, price, priceOverride, notes, sidewalk, other });
  }, [name, address, email, pgp, mp, pro4, drip, zones, valves, timer, price, priceOverride, notes, sidewalk, other]);

  const canNext = [
    name.trim().length > 0 && address.trim().length > 0,
    totalHeads > 0 || drip > 0,
    displayPrice.length > 0,
    true,
  ];

  function reset() {
    clearDraft();
    setStep(0); setDone(false); setJobType(null); setSelectedCustomer(null);
    setName(""); setAddress(""); setEmail("");
    setPgp(0); setMp(0); setPro4(0);
    setDrip(0); setZones(0); setValves(0);
    setTimer(TIMER_OPTIONS[0]);
    setPrice(""); setPriceOverride(""); setNotes(""); setSidewalk(""); setOther("");
  }

  const [pdfId, setPdfId] = useState(null);
  const [sendingEmail, setSendingEmail] = useState(false);
  const [customMessage, setCustomMessage] = useState("");
  
  async function generate() {
    setLoading(true);
    
    const estimateData = {
      customer_name: name,
      customer_address: address,
      customer_email: email,
      date: proposalDate,
      hunter_pgp_ultra: String(pgp),
      mp_rotor_nozzle: String(mp),
      hunter_pro4_spray: String(pro4),
      drip_zones: String(drip),
      number_of_zones: String(zones),
      irritrol_valves: String(valves),
      hydrawise_timer: timer,
      price: displayPrice,
      notes: notes,
      sidewalk_strip: sidewalk,
      other_addon: other,
      // User info for email sending
      prepared_by_name: currentUser?.name || "W.L. Toomey Irrigation",
      prepared_by_email: currentUser?.email || "",
      smtp_user: currentUser?.email || "",
      smtp_password: currentUser?.smtp_password || ""
    };
    
    try {
      // Replace with your Render URL after deployment
      const BACKEND_URL = 'https://toomey-backend-production.up.railway.app';
      
      const response = await fetch(`${BACKEND_URL}/generate-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(estimateData)
      });
      
      const result = await response.json();
      
      if (result.success) {
        setPdfId(result.pdf_id);
      } else {
        alert('Failed to generate PDF: ' + (result.error || 'Unknown error'));
      }
    } catch (err) {
      console.error('PDF generation failed:', err);
      alert('Failed to connect to PDF generator. Please check your connection.');
    }
    
    setLoading(false);
    setDone(true);

    // Save to Firebase
    if (window.TFB) {
      window.TFB.save({
        jobType: 'new_installation',
        status: 'pending',
        customer: { name, address, email },
        system: { pgp, mp, pro4, drip, zones, valves, timer },
        addOns: { sidewalk, other },
        notes,
        price: displayPrice,
        preparedBy: currentUser?.name || '',
        preparedByEmail: currentUser?.email || '',
      });
    }
  }
  
  async function sendToClient() {
    if (!pdfId) return;
    
    setSendingEmail(true);
    
    try {
      const BACKEND_URL = 'https://toomey-backend-production.up.railway.app';
      
      const response = await fetch(`${BACKEND_URL}/send-pdf/${pdfId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: customMessage.trim() })
      });
      
      const result = await response.json();
      
      if (result.success) {
        alert(`✅ Proposal sent to ${email}!`);
        setCustomMessage(""); // Clear message after sending
      } else {
        alert('Failed to send email: ' + (result.error || 'Unknown error'));
      }
    } catch (err) {
      console.error('Email send failed:', err);
      alert('Failed to send email. Please try again.');
    }
    
    setSendingEmail(false);
  }

  // ── Done screen ────────────────────────────────────────────────────────────
  if (done) {
    return (
      <div id="app-inner">
        <div className="brand">
          <div className="brand-icon"><img src={window.TOOMEY_LOGO} style={{width:'100%',height:'100%',objectFit:'contain',borderRadius:10}} alt="Toomey" /></div>
          <div>
            <div className="brand-sub">W.L. Toomey Irrigation</div>
            <div className="brand-title">Estimate Builder</div>
          </div>
        </div>

        <div className="card">
          <div className="done-header">
            <div className="done-emoji">✅</div>
            <div className="done-title">Proposal Complete!</div>
            <div className="done-sub">W.L. Toomey Irrigation · {proposalDate}</div>
          </div>
          <div className="card-body">
            <div className="customer-banner">
              <div className="customer-name">{name}</div>
              <div className="customer-address">{address}</div>
              {email && <div className="customer-email">{email}</div>}
              <div className="customer-date">Prepared: {proposalDate}</div>
            </div>

            <InnerCard title="🌀 System">
              <Row label="Hunter PGP-Ultra Rotary" value={pgp  > 0 ? `${pgp} heads`  : null} />
              <Row label="Rotor Streamer"          value={mp   > 0 ? `${mp} heads`   : null} />
              <Row label="Hunter Pro-4 Spray"      value={pro4 > 0 ? `${pro4} heads` : null} />
              <Row label="Total Heads"             value={totalHeads} accent />
              <Row label="Drip Zones"              value={drip   > 0 ? drip   : null} />
              <Row label="# of Zones"              value={zones  > 0 ? zones  : null} />
              <Row label="Irritrol Valves"         value={valves > 0 ? valves : null} />
              <Row label="Controller"              value={timer} />
            </InnerCard>

            {(sidewalk || other) && (
              <InnerCard title="✨ Add-Ons">
                <Row label="Sidewalk Strip" value={sidewalk} />
                <Row label="Other"          value={other} />
              </InnerCard>
            )}

            {notes && (
              <InnerCard title="📝 Notes">
                <p style={{margin:0,fontSize:15,color:"#475569",lineHeight:1.6}}>{notes}</p>
              </InnerCard>
            )}

            <div className="price-callout">
              <div>
                <div className="price-label">Total Price</div>
                <div className="price-val">${displayPrice}</div>
                <div className="price-note">Excl. plumbing / backflow</div>
              </div>
              <span style={{fontSize:48}}>💰</span>
            </div>

            {/* Preview & Send buttons */}
            {pdfId ? (
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <a
                  href={`https://toomey-backend-production.up.railway.app/preview-pdf/${pdfId}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{
                    display:'block',padding:'16px 20px',borderRadius:14,
                    background:'linear-gradient(135deg,#1a3a6b,#2563eb)',
                    color:'white',textAlign:'center',fontSize:17,fontWeight:700,
                    textDecoration:'none',boxShadow:'0 4px 16px rgba(37,99,235,0.35)'
                  }}
                >
                  📄 Preview PDF
                </a>
                
                {email && (
                  <>
                    {/* Custom message input */}
                    <div style={{background:'#f8fafc',borderRadius:14,padding:'16px 18px'}}>
                      <label style={{fontSize:12,fontWeight:700,color:'#475569',letterSpacing:'0.04em',textTransform:'uppercase',display:'block',marginBottom:8}}>
                        ✏️ Add Personal Note (Optional)
                      </label>
                      <textarea
                        value={customMessage}
                        onChange={e => setCustomMessage(e.target.value)}
                        placeholder="e.g., Great meeting you today! Looking forward to working with you."
                        rows={3}
                        style={{
                          width:'100%',padding:'12px 14px',border:'1.5px solid #e2e8f0',
                          borderRadius:10,fontSize:15,fontFamily:'inherit',
                          background:'white',color:'#1e293b',outline:'none',
                          resize:'vertical',boxSizing:'border-box'
                        }}
                      />
                      <div style={{fontSize:12,color:'#64748b',marginTop:6}}>
                        This will be added to the email before sending.
                      </div>
                    </div>
                    
                    <button
                      onClick={sendToClient}
                      disabled={sendingEmail}
                      style={{
                        padding:'16px 20px',borderRadius:14,border:'2px solid #10b981',
                        background:'white',color:'#10b981',fontSize:17,fontWeight:700,
                        cursor:sendingEmail?'default':'pointer',
                        opacity:sendingEmail?0.6:1
                      }}
                    >
                      {sendingEmail ? '📧 Sending...' : `📧 Send to ${name}`}
                    </button>
                  </>
                )}
                
                {!email && (
                  <div className="banner-yellow">
                    ⚠️ No customer email provided — cannot auto-send proposal. Preview PDF above and email manually.
                  </div>
                )}
              </div>
            ) : (
              <div className="banner-blue">
                <strong>⚙️ Backend Setup Required:</strong> Deploy the backend server to enable PDF generation. See <code>DEPLOY.md</code> in the backend folder.
              </div>
            )}
          </div>
        </div>

        <div className="nav-bar">
          <button className="nav-btn-back" onClick={() => { setDone(false); setStep(3); }}>← Edit</button>
          <button className="nav-btn-primary" onClick={reset}>+ New Estimate</button>
        </div>
      </div>
    );
  }

  // ── User selection screen ──────────────────────────────────────────────────
  if (!currentUser) {
    return (
      <div id="app-inner">
        <div className="brand">
          <div className="brand-icon"><img src={window.TOOMEY_LOGO} style={{width:'100%',height:'100%',objectFit:'contain',borderRadius:10}} alt="Toomey" /></div>
          <div>
            <div className="brand-sub">W.L. Toomey Irrigation</div>
            <div className="brand-title">Estimate Builder</div>
          </div>
        </div>

        <div className="card">
          <div className="card-header" style={{textAlign:'center',padding:'32px 24px'}}>
            <div style={{fontSize:22,fontWeight:700,color:'white',marginBottom:6}}>Who's Using the App?</div>
            <div style={{fontSize:14,opacity:0.8,color:'white'}}>Select your name to continue</div>
          </div>
          <div className="card-body">
            {TEAM_MEMBERS.map((member, i) => (
              <div
                key={i}
                onClick={() => {
                  // Prompt for email password
                  const password = prompt(`Enter your email password for ${member.email}:\n\n(This is stored locally on your iPad only)`);
                  if (password) {
                    const user = { ...member, smtp_password: password };
                    saveUser(user);
                    setCurrentUser(user);
                  }
                }}
                style={{
                  background:'#f8fafc',borderRadius:16,padding:'20px 24px',
                  cursor:'pointer',border:'2px solid #e2e8f0',
                  marginBottom:12,transition:'all 0.2s',
                  WebkitTapHighlightColor:'transparent'
                }}
                onMouseEnter={e => {e.target.style.borderColor='#2563eb'; e.target.style.background='#eff6ff';}}
                onMouseLeave={e => {e.target.style.borderColor='#e2e8f0'; e.target.style.background='#f8fafc';}}
              >
                <div style={{fontSize:18,fontWeight:700,color:'#1a3a6b',marginBottom:4}}>{member.name}</div>
                <div style={{fontSize:14,color:'#64748b'}}>{member.title}</div>
                <div style={{fontSize:13,color:'#94a3b8',marginTop:4}}>{member.email}</div>
              </div>
            ))}
            
            <div style={{marginTop:24,padding:16,background:'#fffbeb',borderRadius:12,border:'1px solid #fde68a'}}>
              <p style={{margin:0,fontSize:13,color:'#92400e',lineHeight:1.6}}>
                <strong>🔒 Your password is stored securely on this iPad only.</strong> It's never sent anywhere except directly to your email provider when sending proposals.
              </p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── Home screen ─────────────────────────────────────────────────────────────
  if (!jobType) {
    return (
      <HomeScreen
        currentUser={currentUser}
        onSelect={setJobType}
        onSwitchUser={() => { clearUser(); setCurrentUser(null); }}
      />
    );
  }

  // ── New job types: customer select then job flow ──────────────────────────────
  if (jobType !== 'new_installation') {
    if (!selectedCustomer) {
      return (
        <CustomerSelect
          jobType={jobType}
          onSelect={c => setSelectedCustomer(c)}
          onBack={() => setJobType(null)}
        />
      );
    }
    if (jobType === 'revamp' || jobType === 'service_call' || jobType === 'system_recommendations') {
      return (
        <JobFlow
          jobType={jobType}
          customer={selectedCustomer}
          onBack={() => setSelectedCustomer(null)}
          onHome={() => { setJobType(null); setSelectedCustomer(null); }}
          currentUser={currentUser}
        />
      );
    }
    return (
      <JobPlaceholder
        jobType={jobType}
        customer={selectedCustomer}
        onBack={() => setSelectedCustomer(null)}
      />
    );
  }

  // ── Main form ──────────────────────────────────────────────────────────────
  return (
    <div id="app-inner">
      {/* User indicator in brand bar */}
      <div className="brand">
        <div className="brand-icon"><img src={window.TOOMEY_LOGO} style={{width:'100%',height:'100%',objectFit:'contain',borderRadius:10}} alt="Toomey" /></div>
        <div style={{flex:1}}>
          <div className="brand-sub">W.L. Toomey Irrigation</div>
          <div className="brand-title">Estimate Builder</div>
        </div>
        <button
          onClick={() => {
            if (confirm(`Switch user?\n\nCurrently: ${currentUser.name}`)) {
              clearUser();
              setCurrentUser(null);
            }
          }}
          style={{
            padding:'8px 14px',borderRadius:10,border:'1.5px solid rgba(255,255,255,0.3)',
            background:'rgba(255,255,255,0.1)',color:'white',fontSize:12,fontWeight:600,
            cursor:'pointer',WebkitTapHighlightColor:'transparent'
          }}
        >
          {currentUser.name.split(' ')[0]} ▾
        </button>
      </div>

      <div className="card">
        <div className="card-header">
          <StepBar step={step} />
        </div>

        <div className="card-body">

          {/* ── Step 0: Customer ─────────────────────────────────────────── */}
          {step === 0 && <>
            <div>
              <div className="section-title">Customer Information</div>
              <div className="section-sub">Appears on the proposal cover page.</div>
            </div>
            <Field label="Customer Name"            value={name}    onChange={setName}    placeholder="John & Jane Smith"                   icon="👤" />
            <AddressField label="Property Address"  value={address} onChange={setAddress} placeholder="123 Oak Street, Lexington, MA 02420" icon="🏡" />
            <Field label="Email Address (optional)" value={email}   onChange={setEmail}   placeholder="john@example.com"                    icon="✉️" type="email" />
            <div className="banner-date">
              <span style={{fontSize:22}}>📅</span>
              <div>
                <div className="banner-date-label">Proposal Date</div>
                <div className="banner-date-val">{proposalDate}</div>
              </div>
            </div>
            {!canNext[0] && <p className="hint">Name and address required to continue</p>}
          </>}

          {/* ── Step 1: System ───────────────────────────────────────────── */}
          {step === 1 && <>
            <div>
              <div className="section-title">System Specifications</div>
              <div className="section-sub">Tap +/− to set quantities for each component.</div>
            </div>
            <InnerCard title="🌀 Spray & Rotary Heads">
              <Stepper label="Hunter PGP-Ultra Rotary Heads" value={pgp}  onChange={setPgp}  icon="🔵" />
              <Stepper label="Rotor Streamer Heads"          value={mp}   onChange={setMp}   icon="🟢" />
              <Stepper label="Hunter Pro-4 Spray Heads"      value={pro4} onChange={setPro4} icon="🟡" />
              <div className="total-pill">
                <span className="total-pill-label">Total Heads</span>
                <span className="total-pill-val">{totalHeads}</span>
              </div>
            </InnerCard>
            <InnerCard title="🔧 Zones & Valves">
              <Stepper label="Drip Zones"          value={drip}   onChange={setDrip}   icon="💧" />
              <Stepper label="Number of Zones"     value={zones}  onChange={setZones}  icon="🗺" />
              <Stepper label="Irritrol 2400T Valves" value={valves} onChange={setValves} icon="🔩" />
            </InnerCard>
            <InnerCard title="📡 Controller">
              <SelectField label="Controller Model" value={timer} onChange={setTimer} options={TIMER_OPTIONS} />
            </InnerCard>
            {!canNext[1] && <p className="hint">Add at least one head or drip zone to continue</p>}
          </>}

          {/* ── Step 2: Add-Ons & Price ──────────────────────────────────── */}
          {step === 2 && <>
            <div>
              <div className="section-title">Add-Ons & Pricing</div>
              <div className="section-sub">Auto-calculated based on system specs. You can override if needed.</div>
            </div>
            <InnerCard title="💰 Proposal Price">
              {/* Show auto-calculated price */}
              <div style={{background:"#f0f9ff",borderRadius:12,padding:"14px 16px",marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#0369a1",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>
                  Auto-Calculated Price
                </div>
                <div style={{fontSize:28,fontWeight:700,color:"#0c4a6e",fontFamily:"Georgia,serif",marginBottom:6}}>
                  ${autoPrice.toLocaleString()}
                </div>
                {(totalHeads > 0 || drip > 0) && (
                  <div style={{fontSize:13,color:"#0369a1",lineHeight:1.5}}>
                    {getPriceBreakdown()}
                  </div>
                )}
              </div>
              
              {/* Override field */}
              <Field 
                label="Override Price (optional - leave blank to use auto-calculated)" 
                value={priceOverride} 
                onChange={setPriceOverride} 
                placeholder={`Auto: ${autoPrice.toLocaleString()}`}
                icon="✏️" 
              />
              <div className="banner-yellow">Plumbing / backflow preventer is billed separately per local code requirements.</div>
            </InnerCard>
            <InnerCard title="✨ Optional Add-Ons">
              <Field label="Sidewalk Strip" value={sidewalk} onChange={setSidewalk} placeholder="e.g. 6 spray heads – $450"      icon="🚶" />
              <Field label="Other Add-On"   value={other}    onChange={setOther}    placeholder="e.g. Rain/freeze sensor – $150" icon="🌧" />
            </InnerCard>
            <InnerCard title="📝 Notes">
              <AreaField label="Additional Notes" value={notes} onChange={setNotes} placeholder="e.g. Zone 1–3 front lawn, Zone 4–5 backyard..." icon="📋" />
            </InnerCard>
          </>}

          {/* ── Step 3: Review ───────────────────────────────────────────── */}
          {step === 3 && <>
            <div>
              <div className="section-title">Review Estimate</div>
              <div className="section-sub">Confirm before generating the proposal.</div>
            </div>
            <InnerCard title="👤 Customer">
              <Row label="Name"    value={name}           accent />
              <Row label="Address" value={address} />
              <Row label="Email"   value={email || "—"} />
              <Row label="Date"    value={proposalDate} />
            </InnerCard>
            <InnerCard title="🌀 System">
              <Row label="Hunter PGP-Ultra Rotary" value={pgp   > 0 ? pgp   : null} />
              <Row label="Rotor Streamer"          value={mp    > 0 ? mp    : null} />
              <Row label="Hunter Pro-4 Spray"      value={pro4  > 0 ? pro4  : null} />
              <Row label="Total Heads"             value={totalHeads} accent />
              <Row label="Drip Zones"              value={drip   > 0 ? drip   : null} />
              <Row label="# of Zones"              value={zones  > 0 ? zones  : null} />
              <Row label="Irritrol Valves"         value={valves > 0 ? valves : null} />
              <Row label="Controller"              value={timer} />
            </InnerCard>
            {(sidewalk || other || notes) && (
              <InnerCard title="✨ Add-Ons & Notes">
                <Row label="Sidewalk Strip" value={sidewalk} />
                <Row label="Other"          value={other} />
                {notes && <p style={{margin:0,paddingTop:8,fontSize:15,color:"#475569",lineHeight:1.6}}>{notes}</p>}
              </InnerCard>
            )}
            <div className="price-callout">
              <div>
                <div className="price-label">Total Price</div>
                <div className="price-val">${displayPrice}</div>
                <div className="price-note">Excludes plumbing</div>
              </div>
              <span style={{fontSize:50}}>💧</span>
            </div>
          </>}

        </div>{/* card-body */}
      </div>{/* card */}

      {/* ── Sticky bottom nav ───────────────────────────────────────────────── */}
      <div className="nav-bar">
        {step > 0
          ? <button className="nav-btn-back" onClick={() => setStep(s => s - 1)}>← Back</button>
          : <button className="nav-btn-back" onClick={() => setJobType(null)}>⌂ Home</button>
        }
        {step < 3
          ? <button className="nav-btn-primary" disabled={!canNext[step]} onClick={() => { if (canNext[step]) setStep(s => s + 1); }}>
              Continue →
            </button>
          : <button className="nav-btn-primary" disabled={loading} onClick={generate}>
              {loading ? "⏳  Generating…" : "📄  Generate Proposal"}
            </button>
        }
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<!-- Register service worker for offline support -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
