    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* Fill the whole screen including notch/home indicator areas */
      height: -webkit-fill-available;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      /* Prevent overscroll bounce showing white background in standalone mode */
      overscroll-behavior: none;
      background: #0c1e3c;
      /* Stretch body background under the status bar */
      padding-top: env(safe-area-inset-top);
    }

    /* Prevent double-tap zoom anywhere */
    * { touch-action: manipulation; }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    #app {
      min-height: 100dvh;
      background: linear-gradient(160deg, #0c1e3c 0%, #1a3a6b 55%, #0c1e3c 100%);

      flex-direction: column;
      align-items: center;

    .brand {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 16px;
    }
    .brand-icon {
      width: 50px; height: 50px; border-radius: 14px;
      background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0; padding: 3px;
    }
    .brand-sub { color: rgba(255,255,255,0.55); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .brand-title { color: white; font-size: 20px; font-weight: 700; margin-top: 2px; }

    /* ── Card ──────────────────────────────────────────────────────────────── */
    .card {
      width: 100%; max-width: 680px;
      background: white; border-radius: 22px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    /* ── Header / step bar ─────────────────────────────────────────────────── */
    .card-header {
      background: linear-gradient(135deg, #1a3a6b 0%, #2563eb 100%);
      padding: 22px 22px 18px;
    }
    .step-bar { display: flex; align-items: flex-start; }
    .step-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .step-bar-track { display: flex; align-items: center; width: 100%; }
    .step-line { flex: 1; height: 3px; transition: background 0.3s; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; transition: all 0.3s;

    .step-circle.done  { background: rgba(255,255,255,0.9); color: #1a3a6b; }
    .step-circle.active{ background: white; color: #1a3a6b; box-shadow: 0 0 0 5px rgba(255,255,255,0.25); }
    .step-circle.future{ background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }
    .step-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; text-align: center; line-height: 1.2;
    }
    .step-label.active { color: white; }
    .step-label.other  { color: rgba(255,255,255,0.5); }

    /* ── Card body ─────────────────────────────────────────────────────────── */
    .card-body {
      padding: 24px 22px 28px;

    /* ── Inner section card ────────────────────────────────────────────────── */

      background: #f8fafc; border-radius: 18px;

    input, select, textarea {
      font-family: inherit;

    /* ── Total heads pill ──────────────────────────────────────────────────── */
    .total-pill {
      background: linear-gradient(135deg,#1a3a6b,#2563eb);

    .summary-row {

    .nav-btn-primary:disabled {

    .customer-banner {

<script type="module">

import{getStorage,ref as stRef,uploadString,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
const cfg={apiKey:"AIzaSyCQDkIKg33wi8LZlJmTiGXEUBw_xlbWYBI",authDomain:"toomey-estimator.firebaseapp.com",projectId:"toomey-estimator",storageBucket:"toomey-estimator.firebasestorage.app",messagingSenderId:"1062716214564",appId:"1:1062716214564:web:af169caa9c952ea65ab7b1"};
const app=initializeApp(cfg);
const db=getFirestore(app);
const storage=getStorage(app);
window.TFB={
  async save(data,id){
    try{
      if(id){
        await setDoc(doc(db,'estimates',id),{...data,createdAt:new Date().toISOString()});
        return id;
      }
      const r=await addDoc(collection(db,'estimates'),{...data,createdAt:new Date().toISOString()});
      console.log('Saved:',r.id);return r.id;
    }catch(e){console.error('Firebase save failed:',e);return null;}
  },
  async getById(id){
    try{
      if(!id)return null;
      const snap=await getDoc(doc(db,'estimates',id));
      return snap.exists()?{id:snap.id,...snap.data()}:null;
    }catch(e){console.error('Firebase getById failed:',e);return null;}
  },
  async uploadPhoto(dataUrl,path){
    try{
      const r=stRef(storage,path);
      await uploadString(r,dataUrl,'data_url');
      return await getDownloadURL(r);
    }catch(e){
      console.warn('Storage upload failed, using base64 fallback:',e);
      return dataUrl;
    }
  },
  async uploadPdf(base64,path){
    try{
      const r=stRef(storage,path);
      await uploadString(r,base64,'base64');
      return await getDownloadURL(r);
    }catch(e){
      console.warn('PDF Storage upload failed:',e);
      return null;
    }
  }
};
</script>

<script type="text/babel">

function today() {

}

// User management - persist who's logged in

// ── Customer storage ──────────────────────────────────────────────────────────
// ── Customer list (loaded from Google Sheet "Customers" tab) ─────────────────
const CUSTOMER_LIST_CACHE_KEY = 'toomey_customer_list_v3';
const CUSTOMER_LIST_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours

async function loadCustomerList() {
  try {
    const cached = JSON.parse(localStorage.getItem(CUSTOMER_LIST_CACHE_KEY) || '{}');
    if (cached.items && cached.ts && (Date.now() - cached.ts) < CUSTOMER_LIST_CACHE_TTL) {
      return cached.items;
    }
  } catch(e) {}
  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'get_customer_list' })
    });
    const data = await resp.json();
    const items = (data.customers || []).map((c, i) => ({ ...c, id: 'cust_' + i }));
    if (items.length > 0) {
      try { localStorage.setItem(CUSTOMER_LIST_CACHE_KEY, JSON.stringify({ items, ts: Date.now() })); } catch(e) {}
    }
    return items;
  } catch(e) {
    console.warn('Customer list fetch failed:', e);
    return [];
  }
}

}

async function compressPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.floor(img.width  * scale);
        canvas.height = Math.floor(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Sub-components ───────────────────────────────────────────────────────────

function StepBar({ step }) {
  const labels = ["Customer","System","Add-Ons","Review"];
  const lineColor = (i) => i < step ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.25)";
  return (
    <div className="step-bar">
      {labels.map((label, i) => (
        <div key={i} className="step-bar-item">
          <div className="step-bar-track">
            {i > 0 && <div className="step-line" style={{background: lineColor(i)}} />}
            <div className={"step-circle " + (i < step ? "done" : i === step ? "active" : "future")}>
              {i < step ? "✓" : i + 1}
            </div>
            {i < labels.length - 1 && <div className="step-line" style={{background: lineColor(i+1)}} />}
          </div>
          <span className={"step-label " + (i === step ? "active" : "other")}>{label}</span>
        </div>
      ))}
    </div>
  );
}

function Stepper({ label, value, onChange, icon }) {
  return (
    <div>
      <label className="field-label">{icon && <span style={{marginRight:6}}>{icon}</span>}{label}</label>
      <div className="stepper">
        <button
          className={"stepper-btn minus" + (value === 0 ? " zero" : "")}
          onClick={() => onChange(Math.max(0, value - 1))}
          aria-label={"Decrease " + label}
        >−</button>
        <input
          type="number"
          min="0"
          max="999"
          value={value === 0 ? '' : value}
          onChange={e => onChange(Math.max(0, Math.min(999, parseInt(e.target.value) || 0)))}
          onBlur={e => { if (e.target.value === '') onChange(0); }}
          placeholder="0"
          className={"stepper-val" + (value === 0 ? " zero" : "")}

function AddressField({ label, value, onChange, placeholder, icon }) {
  const [suggestions, setSuggestions] = useState([]);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const inputRef = React.useRef(null);

  async function handleInputChange(text) {
    onChange(text);
    
    if (text.length < 3) {
      setSuggestions([]);
      setShowSuggestions(false);
      return;
    }

    // Call Google Places Autocomplete API
    try {
      const service = new google.maps.places.AutocompleteService();
      service.getPlacePredictions(
        {
          input: text,
          types: ['address'],
          componentRestrictions: { country: 'us' }
        },
        (predictions, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK && predictions) {
            setSuggestions(predictions);
            setShowSuggestions(true);
          } else {
            setSuggestions([]);
            setShowSuggestions(false);
          }
        }
      );
    } catch (err) {
      console.error('Places API error:', err);
    }
  }

  function selectAddress(prediction) {
    onChange(prediction.description);
    setSuggestions([]);
    setShowSuggestions(false);
  }

  return (
    <div style={{ position: 'relative' }}>
      <label className="field-label">{icon && <span style={{marginRight:6}}>{icon}</span>}{label}</label>
      <input
        ref={inputRef}
        type="text"
        value={value}
        onChange={e => handleInputChange(e.target.value)}
        placeholder={placeholder}
        autoCapitalize="words"
        autoCorrect="off"
        autoComplete="off"
      />
      {showSuggestions && suggestions.length > 0 && (
        <div style={{
          position: 'absolute',
          top: '100%',
          left: 0,
          right: 0,
          background: 'white',
          border: '1.5px solid #e2e8f0',
          borderTop: 'none',
          borderRadius: '0 0 14px 14px',
          boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
          maxHeight: '240px',
          overflowY: 'auto',
          zIndex: 1000,
          marginTop: '-12px',
          paddingTop: '12px'
        }}>
          {suggestions.map((pred, i) => (
            <div
              key={pred.place_id}
              onClick={() => selectAddress(pred)}
              style={{
                padding: '12px 16px',
                cursor: 'pointer',
                fontSize: '15px',
                color: '#1e293b',
                borderBottom: i < suggestions.length - 1 ? '1px solid #f1f5f9' : 'none',
                background: 'white',
                transition: 'background 0.15s'
              }}
              onMouseEnter={e => e.target.style.background = '#f8fafc'}
              onMouseLeave={e => e.target.style.background = 'white'}
            >
              <div style={{ fontWeight: 600, marginBottom: 2 }}>
                {pred.structured_formatting.main_text}
              </div>
              <div style={{ fontSize: 13, color: '#64748b' }}>
                {pred.structured_formatting.secondary_text}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── PhotoMarkupModal ──────────────────────────────────────────────────────────
function PhotoMarkupModal({ photo, onSave, onCancel }) {
  const canvasRef   = useRef(null);
  const baseRef     = useRef(null);       // ImageData of original photo
  const markupsRef  = useRef([]);         // sync ref for event handlers
  const drawingRef  = useRef(false);
  const startPtRef  = useRef(null);
  const toolRef     = useRef('circle');
  const colorRef    = useRef('#ef4444');
  const dragRef     = useRef(null);       // {idx, part, startPos, origMarkup}

  const [tool, setTool]         = useState('circle');
  const [color, setColor]       = useState('#ef4444');
  const [markups, setMarkups]   = useState([]);
  const [selIdx, setSelIdx]     = useState(null);
  const [textMode, setTextMode] = useState(false);
  const [pendingBox, setPendingBox]   = useState(null);
  const [pendingText, setPendingText] = useState('');

  // Keep refs in sync with state
  useEffect(() => { toolRef.current  = tool;    }, [tool]);
  useEffect(() => { colorRef.current = color;   }, [color]);
  useEffect(() => { markupsRef.current = markups; redrawAll(markups, selIdx); }, [markups, selIdx]);

  // Load photo onto canvas
  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      const canvas = canvasRef.current; if (!canvas) return;
      const maxW = Math.min(window.innerWidth - 16, 1000);
      const maxH = window.innerHeight - 200;
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);
      canvas.width  = Math.floor(img.width  * scale);
      canvas.height = Math.floor(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      baseRef.current = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    };
    img.src = photo;
  }, [photo]);

  function getPos(e) {
    const canvas = canvasRef.current, rect = canvas.getBoundingClientRect();
    const src = e.changedTouches ? e.changedTouches[0] : (e.touches ? e.touches[0] : e);
    return { x: (src.clientX - rect.left) * (canvas.width / rect.width),
             y: (src.clientY - rect.top)  * (canvas.height / rect.height) };
  }

  function drawArrowOnCtx(ctx, x1, y1, x2, y2) {
    const len = 14, a = Math.atan2(y2-y1, x2-x1);
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.moveTo(x2,y2); ctx.lineTo(x2-len*Math.cos(a-Math.PI/6), y2-len*Math.sin(a-Math.PI/6));
    ctx.moveTo(x2,y2); ctx.lineTo(x2-len*Math.cos(a+Math.PI/6), y2-len*Math.sin(a+Math.PI/6));
    ctx.stroke();
  }

  function wrapOnCtx(ctx, text, x, y, maxW, lineH) {
    if (!text) return;
    const words = text.split(' '); let line = '';
    for (const word of words) {
      const test = line + word + ' ';
      if (ctx.measureText(test).width > maxW && line) {
        ctx.strokeText(line.trim(), x, y); ctx.fillText(line.trim(), x, y);
        line = word + ' '; y += lineH;
      } else { line = test; }
    }
    if (line.trim()) { ctx.strokeText(line.trim(), x, y); ctx.fillText(line.trim(), x, y); }
  }

  function redrawAll(list, hlIdx) {
    const canvas = canvasRef.current; if (!canvas || !baseRef.current) return;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(baseRef.current, 0, 0);
    list.forEach((m, i) => {
      const sel = i === hlIdx;
      ctx.lineCap = 'round';
      if (m.type === 'circle') {
        if (sel) { ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(m.cx,m.cy,m.rx,m.ry,0,0,Math.PI*2); ctx.stroke(); }
        ctx.strokeStyle = m.color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(m.cx,m.cy,m.rx,m.ry,0,0,Math.PI*2); ctx.stroke();
      } else if (m.type === 'arrow') {
        if (sel) { ctx.strokeStyle='#fff'; ctx.lineWidth=5; drawArrowOnCtx(ctx,m.x1,m.y1,m.x2,m.y2); }
        ctx.strokeStyle = m.color; ctx.lineWidth = 3; drawArrowOnCtx(ctx,m.x1,m.y1,m.x2,m.y2);
      } else if (m.type === 'text') {
        const fs = m.fontSize || 18;
        ctx.strokeStyle = m.color; ctx.lineWidth = 2; ctx.strokeRect(m.x,m.y,m.w,m.h);
        ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(m.x,m.y,m.w,m.h);
        ctx.font = `bold ${fs}px Arial`; ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.fillStyle = m.color;
        wrapOnCtx(ctx, m.text, m.x+5, m.y+fs+4, m.w-10, fs*1.35);
        // Resize handle (always visible on text boxes)
        const hx = m.x+m.w-10, hy = m.y+m.h-10;
        ctx.fillStyle = sel ? '#2563eb' : 'rgba(255,255,255,0.9)';
        ctx.fillRect(hx,hy,10,10);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(hx,hy,10,10);
      }
    });
  }

  function hitTest(pt) {
    const list = markupsRef.current;
    for (let i = list.length-1; i >= 0; i--) {
      const m = list[i];
      if (m.type === 'circle') {
        const dx=(pt.x-m.cx)/Math.max(m.rx,1), dy=(pt.y-m.cy)/Math.max(m.ry,1);
        if (dx*dx+dy*dy <= 1.5) return {idx:i, part:'body'};
      } else if (m.type === 'arrow') {
        const dx=m.x2-m.x1, dy=m.y2-m.y1, len2=dx*dx+dy*dy;
        const t=len2?Math.max(0,Math.min(1,((pt.x-m.x1)*dx+(pt.y-m.y1)*dy)/len2)):0;
        if (Math.hypot(pt.x-(m.x1+t*dx), pt.y-(m.y1+t*dy)) < 16) return {idx:i, part:'body'};
      } else if (m.type === 'text') {
        if (pt.x>=m.x+m.w-14&&pt.x<=m.x+m.w+4&&pt.y>=m.y+m.h-14&&pt.y<=m.y+m.h+4) return {idx:i, part:'resize'};
        if (pt.x>=m.x&&pt.x<=m.x+m.w&&pt.y>=m.y&&pt.y<=m.y+m.h) return {idx:i, part:'body'};
      }
    }
    return null;
  }

  function applyDrag(origMarkup, part, dx, dy) {
    const m = origMarkup;
    if (part === 'resize' && m.type === 'text') return {...m, w:Math.max(60,m.w+dx), h:Math.max(36,m.h+dy)};
    if (m.type === 'circle') return {...m, cx:m.cx+dx, cy:m.cy+dy};
    if (m.type === 'arrow')  return {...m, x1:m.x1+dx, y1:m.y1+dy, x2:m.x2+dx, y2:m.y2+dy};
    if (m.type === 'text')   return {...m, x:m.x+dx, y:m.y+dy};
    return m;
  }

  function onDown(e) {
    e.preventDefault();
    const pos = getPos(e), t = toolRef.current;
    if (t === 'move') {
      const hit = hitTest(pos);
      if (hit) { setSelIdx(hit.idx); dragRef.current = {idx:hit.idx, part:hit.part, startPos:pos, origMarkup:{...markupsRef.current[hit.idx]}}; }
      else     { setSelIdx(null); dragRef.current = null; }
      return;
    }
    if (t === 'text') { drawingRef.current = true; startPtRef.current = pos; return; }
    drawingRef.current = true; startPtRef.current = pos;
  }

  function onMove(e) {
    e.preventDefault();
    const pos = getPos(e), t = toolRef.current;
    if (t === 'move' && dragRef.current) {
      const ds = dragRef.current, dx = pos.x-ds.startPos.x, dy = pos.y-ds.startPos.y;
      const temp = markupsRef.current.map((m,i) => i===ds.idx ? applyDrag(ds.origMarkup,ds.part,dx,dy) : m);
      redrawAll(temp, ds.idx); return;
    }
    if (!drawingRef.current || !startPtRef.current) return;
    redrawAll(markupsRef.current, selIdx);
    const ctx = canvasRef.current.getContext('2d');
    ctx.strokeStyle = colorRef.current; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (t === 'circle') {
      const cx=(startPtRef.current.x+pos.x)/2, cy=(startPtRef.current.y+pos.y)/2;
      ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(Math.abs(pos.x-startPtRef.current.x)/2,4),Math.max(Math.abs(pos.y-startPtRef.current.y)/2,4),0,0,Math.PI*2); ctx.stroke();
    } else if (t === 'arrow') { drawArrowOnCtx(ctx,startPtRef.current.x,startPtRef.current.y,pos.x,pos.y); }
      else if (t === 'text')  { ctx.setLineDash([4,4]); ctx.strokeRect(startPtRef.current.x,startPtRef.current.y,pos.x-startPtRef.current.x,pos.y-startPtRef.current.y); ctx.setLineDash([]); }
  }

  function onUp(e) {
    e.preventDefault();
    const pos = getPos(e), t = toolRef.current;
    if (t === 'move' && dragRef.current) {
      const ds = dragRef.current, dx = pos.x-ds.startPos.x, dy = pos.y-ds.startPos.y;
      setMarkups(prev => prev.map((m,i) => i===ds.idx ? applyDrag(ds.origMarkup,ds.part,dx,dy) : m));
      dragRef.current = null; return;
    }
    if (!drawingRef.current) return;
    drawingRef.current = false;
    const sp = startPtRef.current; startPtRef.current = null;
    const c = colorRef.current;
    if (t === 'circle') {
      setMarkups(prev => [...prev, {type:'circle', cx:(sp.x+pos.x)/2, cy:(sp.y+pos.y)/2, rx:Math.max(Math.abs(pos.x-sp.x)/2,8), ry:Math.max(Math.abs(pos.y-sp.y)/2,8), color:c}]);
    } else if (t === 'arrow') {
      setMarkups(prev => [...prev, {type:'arrow', x1:sp.x, y1:sp.y, x2:pos.x, y2:pos.y, color:c}]);
    } else if (t === 'text') {
      const w=Math.abs(pos.x-sp.x), h=Math.abs(pos.y-sp.y);
      if (w>30 && h>20) { setPendingBox({x:Math.min(sp.x,pos.x), y:Math.min(sp.y,pos.y), w, h}); setPendingText(''); setTextMode(true); }
    }
  }

  function placeText() {
    if (!pendingText.trim() || !pendingBox) { setTextMode(false); return; }
    const fs = Math.max(14, Math.min(24, Math.floor(pendingBox.w / 9)));
    setMarkups(prev => [...prev, {type:'text', ...pendingBox, text:pendingText.trim(), color:colorRef.current, fontSize:fs}]);
    setTextMode(false); setPendingText('');
  }

  function undo() {
    setMarkups(prev => { setSelIdx(null); return prev.slice(0,-1); });
  }

  function handleSave() {
    redrawAll(markups, null);
    requestAnimationFrame(() => onSave(canvasRef.current.toDataURL('image/jpeg', 0.82)));
  }

  const COLORS = ['#ef4444','#3b82f6','#eab308','#22c55e','#ffffff'];
  const hint = tool==='circle'?'Drag to draw a circle':tool==='arrow'?'Drag to draw an arrow':tool==='text'?'Drag to define text box, then type':selIdx!=null?'Drag to move · drag □ corner to resize':'Tap a markup to select it, then drag to move';

  return (
    <div style={{position:'fixed',inset:0,background:'#0a0a0a',zIndex:9000,display:'flex',flexDirection:'column'}}>
      <div style={{background:'linear-gradient(135deg,#1a3a6b,#2563eb)',padding:'10px 12px',display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',flexShrink:0}}>
        <span style={{color:'white',fontSize:13,fontWeight:700,marginRight:2}}>Markup</span>
        {[['circle','○'],['arrow','→'],['text','T'],['move','⊹']].map(([t,icon])=>(
          <button key={t} onClick={()=>{setTool(t);setSelIdx(null);}} style={{padding:'6px 9px',borderRadius:8,border:`2px solid ${tool===t?'white':'rgba(255,255,255,0.3)'}`,background:tool===t?'white':'transparent',color:tool===t?'#1a3a6b':'white',fontSize:13,fontWeight:700,cursor:'pointer',minWidth:32}}>{icon}</button>
        ))}
        <div style={{width:1,height:22,background:'rgba(255,255,255,0.2)',margin:'0 1px'}}/>
        {COLORS.map(c=>(
          <div key={c} onClick={()=>setColor(c)} style={{width:22,height:22,borderRadius:'50%',background:c,cursor:'pointer',border:`3px solid ${color===c?'white':'transparent'}`,flexShrink:0}}/>
        ))}
        <div style={{flex:1}}/>
        <button onClick={undo} disabled={markups.length===0} style={{padding:'6px 9px',borderRadius:8,border:'1.5px solid rgba(255,255,255,0.4)',background:'transparent',color:markups.length>0?'white':'rgba(255,255,255,0.3)',fontSize:12,cursor:markups.length>0?'pointer':'default'}}>↩</button>
        <button onClick={onCancel} style={{padding:'6px 9px',borderRadius:8,border:'1.5px solid rgba(255,255,255,0.4)',background:'transparent',color:'white',fontSize:12,cursor:'pointer'}}>✕</button>
        <button onClick={handleSave} style={{padding:'6px 14px',borderRadius:8,border:'none',background:'#22c55e',color:'white',fontSize:12,fontWeight:700,cursor:'pointer'}}>✓ Save</button>
      </div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'auto',position:'relative',padding:8}}>
        <canvas ref={canvasRef} style={{display:'block',touchAction:'none',cursor:tool==='move'?'grab':'crosshair',maxWidth:'100%'}}
          onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp}
          onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
        />
        {textMode && (
          <div style={{position:'absolute',bottom:0,left:0,right:0,background:'white',padding:'12px 14px',display:'flex',gap:8,boxShadow:'0 -4px 20px rgba(0,0,0,0.4)'}}>
            <textarea autoFocus value={pendingText} onChange={e=>setPendingText(e.target.value)}
              placeholder="Type your label — text wraps inside the box automatically"
              rows={3} style={{flex:1,padding:'10px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:15,fontFamily:'inherit',resize:'none'}}
            />
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <button onClick={placeText} style={{padding:'10px 16px',borderRadius:10,border:'none',background:'#1a3a6b',color:'white',fontWeight:700,cursor:'pointer',flex:1}}>Place</button>
              <button onClick={()=>{setTextMode(false);setPendingText('');redrawAll(markups,selIdx);}} style={{padding:'8px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',color:'#64748b',cursor:'pointer'}}>✕</button>
            </div>
          </div>
        )}
      </div>
      <div style={{background:'#111',padding:'6px',textAlign:'center',flexShrink:0}}>
        <span style={{color:'rgba(255,255,255,0.45)',fontSize:11}}>{hint}</span>
      </div>
    </div>
  );
}

// ── PDF Generation ────────────────────────────────────────────────────────────
async function generateJobPDF(jobType, customer, photos, selectedItems, laborHours, laborRate, laborTotal, matTotal, taxTotal, grandTotal, notes, currentUser, priceOverride) {
  if (!window.jspdf) throw new Error('jsPDF not loaded');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
  const W = 612, H = 792, M = 50, CW = 512;
  const jt = JOB_TYPES.find(j => j.id === jobType) || {};
  const taxApplies = jobType === 'service_call' || jobType === 'system_recommendations';
  const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let y = 0;

  // ── Header ──
  doc.setFillColor(26, 58, 107);
  doc.rect(0, 0, W, 120, 'F');
  try { if(window._TOOMEY_LOGO_DATA) doc.addImage(window._TOOMEY_LOGO_DATA,'PNG',M,10,100,100); } catch(e){}
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.text('W.L. Toomey Irrigation', M+110, 45);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(12);
  doc.text(jt.label || jobType, M+110, 65);
  doc.setFontSize(9);
  doc.text(today(), W - M, 45, { align: 'right' });
  doc.text(`Prepared by: ${currentUser?.name || ''}`, W - M, 61, { align: 'right' });
  y = 146;

  function sectionHeader(title) {
    doc.setTextColor(26, 58, 107);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text(title, M, y);
    y += 5;
    doc.setDrawColor(26, 58, 107);
    doc.setLineWidth(1);
    doc.line(M, y, M + CW, y);
    y += 14;
    doc.setTextColor(30, 30, 30);
  }

  function checkPageBreak(needed) {
    if (y + needed > H - 55) { doc.addPage(); y = M; }
  }

  // ── Customer ──
  checkPageBreak(80);
  sectionHeader('Customer');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text(customer.name, M, y);
  y += 18;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(80, 80, 80);
  if (customer.address) { doc.text(customer.address, M, y); y += 15; }
  if (customer.email)   { doc.text(customer.email,   M, y); y += 15; }
  if (customer.phone)   { doc.text(customer.phone,   M, y); y += 15; }
  y += 14;

  // ── Photos ──
  if (photos.length > 0) {
    checkPageBreak(60);
    sectionHeader('Photos');
    const PW = 240, PH = 175, GAP = CW - 2 * PW;
    let col = 0, rowY = y;
    for (let i = 0; i < photos.length; i++) {
      if (col === 0) { checkPageBreak(PH + 30); rowY = y; }
      const px = M + col * (PW + GAP);
      try { doc.addImage(photos[i].dataUrl, 'JPEG', px, rowY, PW, PH); }
      catch(e) {
        doc.setFillColor(240, 240, 240);
        doc.rect(px, rowY, PW, PH, 'F');
        doc.setTextColor(150, 150, 150);
        doc.setFontSize(9);
        doc.text('[Photo]', px + PW / 2, rowY + PH / 2, { align: 'center' });
        doc.setTextColor(30, 30, 30);
      }
      if (photos[i].caption) {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139);
        doc.text(photos[i].caption, px + PW / 2, rowY + PH + 11, { align: 'center', maxWidth: PW });
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(30, 30, 30);
      }
      col++;
      if (col >= 2) { col = 0; y = rowY + PH + (photos[i-1]?.caption || photos[i].caption ? 26 : 14); rowY = y; }
    }
    if (col > 0) y = rowY + PH + 14;
    y += 10;
  }

  // ── Materials ──
  if (selectedItems.length > 0) {
    checkPageBreak(80);
    sectionHeader('Materials');
    doc.setFillColor(241, 245, 249);
    doc.rect(M, y - 11, CW, 18, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text('Item', M + 6, y);
    doc.text('Qty',  M + CW - 125, y, { align: 'center' });
    if (!priceOverride) {
      doc.text('Unit $', M + CW - 70, y, { align: 'right' });
      doc.text('Total',  M + CW,      y, { align: 'right' });
    }
    y += 10;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    for (const item of selectedItems) {
      checkPageBreak(22);
      doc.setTextColor(30, 30, 30);
      const nm = item.product.name.length > 44 ? item.product.name.slice(0, 44) + '…' : item.product.name;
      doc.text(nm, M + 6, y);
      doc.text(String(item.qty), M + CW - 125, y, { align: 'center' });
      if (!priceOverride) {
        doc.text(`$${item.product.price.toFixed(2)}`,      M + CW - 70, y, { align: 'right' });
        doc.text(`$${fmt(item.product.price * item.qty)}`, M + CW,      y, { align: 'right' });
      }
      y += 5;
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.line(M, y, M + CW, y);
      y += 13;
    }
    if (!priceOverride) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(26, 58, 107);
      doc.text('Materials Subtotal', M + CW - 145, y, { align: 'right' });
      doc.text(`$${fmt(matTotal)}`, M + CW, y, { align: 'right' });
      y += 16;
      if (taxApplies) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);
        doc.text('MA Sales Tax (6.25%)', M + CW - 145, y, { align: 'right' });
        doc.text(`$${fmt(taxTotal)}`, M + CW, y, { align: 'right' });
        y += 16;
      }
    }
    y += 8;
  }

  // ── Labor ──
  if (laborHours > 0 && !priceOverride) {
    checkPageBreak(60);
    sectionHeader('Labor');
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(30, 30, 30);
    doc.text(`${laborHours} hour${laborHours !== 1 ? 's' : ''} × $${laborRate}/hr`, M, y);
    doc.setFont('helvetica', 'bold');
    doc.text(`$${fmt(laborTotal)}`, M + CW, y, { align: 'right' });
    y += 22;
  }

  // ── Notes ──
  if (notes.trim()) {
    checkPageBreak(60);
    sectionHeader('Notes');
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(30, 30, 30);
    const noteLines = doc.splitTextToSize(notes.trim(), CW);
    checkPageBreak(noteLines.length * 14 + 10);
    doc.text(noteLines, M, y);
    y += noteLines.length * 14 + 16;
  }

  // ── Grand Total ──
  checkPageBreak(70);
  y += 8;
  const displayTotal = priceOverride ? priceOverride : grandTotal;
  doc.setFillColor(26, 58, 107);
  doc.roundedRect(M, y, CW, 52, 6, 6, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text('GRAND TOTAL', W / 2, y + 17, { align: 'center' });
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text(`$${fmt(Number(displayTotal))}`, W / 2, y + 38, { align: 'center' });

  // ── Footer on every page ──
  const pageCount = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    doc.setFillColor(26, 58, 107);
    doc.rect(0, H - 36, W, 36, 'F');
    doc.setTextColor(200, 215, 235);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text('W.L. Toomey Irrigation  ·  (781) 937-0552  ·  www.ToomeyIrrigation.com  ·  info@toomeyirrigation.com', W / 2, H - 16, { align: 'center' });
    doc.setTextColor(160, 180, 210);
    doc.text(`Page ${p} of ${pageCount}`, W - M, H - 16, { align: 'right' });
  }

  const blob    = doc.output('blob');
  const blobUrl = URL.createObjectURL(blob);
  const dataUrl = doc.output('datauristring');
  return { blob, blobUrl, dataUrl };
}

// ── JobFlow ───────────────────────────────────────────────────────────────────
function JobFlow({ jobType, customer, onBack, onHome, currentUser, queueRowIndex, onQueueComplete, priceList = [], priceListLoading = false }) {
  const jt = JOB_TYPES.find(j => j.id === jobType) || {};
  const STEPS = ['Photos', 'Materials', 'Review'];
  const [step, setStep]     = useState(0);
  const [done, setDone]       = useState(false);
  const [saving, setSaving]   = useState(false);
  const [acceptUrl, setAcceptUrl] = useState('');
  const [submittedJobId, setSubmittedJobId] = useState('');
  const [driveUrl, setDriveUrl] = useState('');

  // Photos
  const [photos, setPhotos]         = useState([]);
  const [markupIdx, setMarkupIdx]   = useState(null);
  const photoInputRef = useRef(null);

  // Materials
  const [matSearch, setMatSearch]       = useState('');
  const [selectedItems, setSelectedItems] = useState([]);

  // Labor
  const [laborHours, setLaborHours] = useState(0);
  const [laborRate,  setLaborRate]  = useState(110);

  // Notes
  const [notes, setNotes] = useState('');

  // Price override (revamp + system_recommendations only)
  const [priceOverride, setPriceOverride] = useState('');

  // PDF / Email
  const [sendStatus, setSendStatus] = useState('idle'); // idle|generating|ready|sending|sent|error
  const [sendError,  setSendError]  = useState('');
  const [pdfDataUrl, setPdfDataUrl] = useState('');
  const [pdfBlobUrl, setPdfBlobUrl] = useState('');
  const [sendEmail,  setSendEmail]  = useState(customer.email || '');
  const [customMsg,  setCustomMsg]  = useState('');
  const [ccOffice,   setCcOffice]   = useState(true);

  // Totals
  const matTotal   = selectedItems.reduce((s, i) => s + i.product.price * i.qty, 0);
  const taxApplies = jobType === 'service_call' || jobType === 'system_recommendations';
  const taxTotal   = taxApplies ? matTotal * 0.0625 : 0;
  const laborTotal = laborHours * laborRate;
  const grandTotal = matTotal + taxTotal + laborTotal;
  const overrideApplies = (jobType === 'revamp' || jobType === 'system_recommendations') && priceOverride.trim() !== '' && !isNaN(parseFloat(priceOverride));
  const effectiveTotal  = overrideApplies ? parseFloat(priceOverride) : grandTotal;

  const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ── Photos ──────────────────────────────────────────────────────────────────
  async function handleCapture(e) {
    const files = Array.from(e.target.files);
    for (const f of files) {
      if (photos.length >= 5) break;
      const compressed = await compressPhoto(f);
      setPhotos(prev => [...prev, { id: Date.now() + Math.random(), dataUrl: compressed, caption: '' }]);
    }
    e.target.value = '';
  }
  function saveMarkup(annotated) {
    setPhotos(prev => prev.map((p, i) => i === markupIdx ? { ...p, dataUrl: annotated } : p));
    setMarkupIdx(null);
  }

  // ── Materials ───────────────────────────────────────────────────────────────
  const filteredProducts = matSearch.trim().length >= 2
    ? priceList.filter(p => p.name.toLowerCase().includes(matSearch.toLowerCase())).slice(0, 60)
    : [];

  function addProduct(product) {
    setSelectedItems(prev => {
      const ex = prev.find(i => i.product.id === product.id);
      return ex ? prev.map(i => i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i)
                : [...prev, { product, qty: 1 }];
    });
  }
  function updateQty(id, qty) {
    if (qty <= 0) setSelectedItems(prev => prev.filter(i => i.product.id !== id));
    else setSelectedItems(prev => prev.map(i => i.product.id === id ? { ...i, qty } : i));
  }

  // ── Submit ──────────────────────────────────────────────────────────────────
  async function submit() {
    setSaving(true);
    try {
      const jobId = `job_${Date.now()}`;
      setSubmittedJobId(jobId);
      if (window.TFB) {
        const photoData = await Promise.all(photos.map(async (p, i) => {
          const url = await window.TFB.uploadPhoto(p.dataUrl, `jobs/${jobId}_photo${i}.jpg`);
          return { url, caption: p.caption };
        }));
        await window.TFB.save({
          jobType, status: 'pending',
          customer: { name: customer.name, address: customer.address, email: customer.email||'', phone: customer.phone||'' },
          photos: photoData,
          materials: selectedItems.map(i => ({ name: i.product.name, qty: i.qty, unit: i.product.unit, unitPrice: i.product.price, total: i.product.price * i.qty })),
          labor: { hours: laborHours, rate: laborRate, total: laborTotal },
          notes,
          totals: { materials: matTotal, tax: taxTotal, labor: laborTotal, grand: grandTotal },
          preparedBy: currentUser?.name || '',
          preparedByEmail: currentUser?.email || '',
        }, jobId);
      }
      // Sync directly to Google Sheets via Apps Script (no Railway middleman)
      try {
        const sheetsResp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action:          'submit_proposal',
            jobType,
            firebaseId:      jobId,
            customerName:    customer.name,
            customerAddress: customer.address || '',
            customerTown:    customer.town    || '',
            customerPhone:   customer.phone   || '',
            customerEmail:   customer.email   || '',
            preparedBy:      currentUser?.name  || '',
            materialsTotal:  matTotal,
            tax:             taxTotal,
            laborTotal,
            grandTotal:      effectiveTotal,
            notes,
          })
        });
        const sheetsResult = await sheetsResp.json().catch(() => ({}));
        if (sheetsResult.accept_url) setAcceptUrl(sheetsResult.accept_url);
        showToast('✅ Synced to Google Sheets');
        // Only remove from queue after Sheets sync succeeds
        if (queueRowIndex && onQueueComplete) { onQueueComplete(); }
      } catch(e) { console.warn('Sheets sync failed:', e); showToast('⚠️ Sheet sync failed — check connection', 'error'); }
    } catch(e) { console.error('Submit error:', e); }
    setSaving(false);
    setDone(true);
  }

  // ── PDF / Email ──────────────────────────────────────────────────────────────
  async function generateAndPreview() {
    setSendStatus('generating');
    setSendError('');
    try {
      const { blobUrl, dataUrl } = await generateJobPDF(
        jobType, customer, photos, selectedItems,
        laborHours, laborRate, laborTotal, matTotal, taxTotal, grandTotal,
        notes, currentUser, overrideApplies ? effectiveTotal : null
      );
      // Revoke any previous blob URL to free memory
      if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
      setPdfBlobUrl(blobUrl);
      setPdfDataUrl(dataUrl);
      setSendStatus('ready');
    } catch(e) {
      setSendError(e.message || 'PDF generation failed');
      setSendStatus('error_gen');
    }
  }

  async function sendPDF() {
    if (!sendEmail.trim()) return;
    if (!currentUser?.smtp_password) {
      setSendError('No email password saved. Sign out and sign back in to re-enter your password.');
      setSendStatus('error');
      return;
    }
    setSendStatus('sending');
    setSendError('');
    try {
      const jt2 = JOB_TYPES.find(j => j.id === jobType) || {};
      const resp = await fetch('https://toomey-backend-production.up.railway.app/send-job-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pdf_base64:        pdfDataUrl.split(',')[1],
          to_email:          sendEmail.trim(),
          customer_name:     customer.name,
          customer_address:  customer.address || '',
          job_type:          jobType,
          job_type_label:    jt2.label || jobType,
          firebase_id:       submittedJobId,
          prepared_by_name:  currentUser?.name  || '',
          prepared_by_email: currentUser?.email || '',
          smtp_password:     currentUser?.smtp_password || '',
          message:           customMsg,
          cc_office:         ccOffice,
          accept_url:        acceptUrl,
        })
      });
      const rawText = await resp.text();
      let result;
      try { result = JSON.parse(rawText); } catch(e) { throw new Error(rawText.slice(0, 300)); }
      if (!resp.ok || result.error) throw new Error(result.error || 'Send failed');
      if (result.driveUrl) setDriveUrl(result.driveUrl);
      setSendStatus('sent');
    } catch(e) {
      setSendError(`Send failed: ${e.message || 'Network error — check your connection and try again.'}`);
      setSendStatus('error');
    }
  }

  // ── Markup modal ─────────────────────────────────────────────────────────────
  if (markupIdx !== null) {
    return <PhotoMarkupModal photo={photos[markupIdx].dataUrl} onSave={saveMarkup} onCancel={() => setMarkupIdx(null)} />;
  }

  // ── Done screen ──────────────────────────────────────────────────────────────
  if (done) {
    const pdfReady = sendStatus === 'ready' || sendStatus === 'sending' || sendStatus === 'sent' || sendStatus === 'error';
    return (
      <div id="app-inner">
        <div className="brand">
          <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:8}} alt="" /></div>
          <div><div className="brand-sub">W.L. Toomey Irrigation</div><div className="brand-title">{jt.label}</div></div>
        </div>
        <div className="card">
          <div className="done-header">
            <div className="done-emoji">✅</div>
            <div className="done-title">{jobType === 'system_recommendations' ? 'Recommendations Submitted!' : 'Job Submitted!'}</div>
            <div className="done-sub">{customer.name} · {today()}</div>
          </div>
          <div className="card-body">
            <div className="customer-banner">
              <div className="customer-name">{customer.name}</div>
              {customer.address && <div className="customer-address">{customer.address}</div>}
              <div className="customer-date">Submitted by {currentUser?.name} · {today()}</div>
            </div>
            {!overrideApplies && (
              <InnerCard title="💰 Summary">
                <Row label="Materials" value={`$${fmt(matTotal)}`} />
                {taxApplies && <Row label="MA Sales Tax (6.25%)" value={`$${fmt(taxTotal)}`} />}
                <Row label="Labor" value={`$${fmt(laborTotal)}`} />

              <div>
                <div className="price-label">Grand Total</div>
                <div className="price-val">${fmt(effectiveTotal)}</div>
                <div className="price-note">{overrideApplies ? 'Price override applied' : 'Materials + Labor'}</div>
              </div>
              <span style={{fontSize:44}}>{jt.icon}</span>
            </div>

            {/* ── PDF & Email ── */}
            <InnerCard title="📄 Proposal PDF">
              {sendStatus === 'idle' && (
                <button onClick={generateAndPreview}
                  style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:'#1a3a6b',color:'white',fontSize:16,fontWeight:700,cursor:'pointer'}}>

                </button>

              {sendStatus === 'generating' && (
                <div style={{textAlign:'center',padding:'14px',color:'#64748b',fontSize:15}}>⏳ Generating PDF…</div>
              )}
              {sendStatus === 'error_gen' && (
                <>
                  <div style={{padding:'10px 14px',borderRadius:10,background:'#fef2f2',border:'1.5px solid #fca5a5',color:'#dc2626',fontSize:14,marginBottom:10}}>{sendError}</div>
                  <button onClick={generateAndPreview}
                    style={{width:'100%',padding:'12px',borderRadius:10,border:'none',background:'#1a3a6b',color:'white',fontSize:15,fontWeight:700,cursor:'pointer'}}>
                    Try Again
                  </button>
                </>
              )}
              {pdfReady && (
                <>
                  <div style={{display:'flex',gap:8,marginBottom:14}}>
                    <a href={pdfDataUrl} target="_blank" rel="noreferrer"
                      style={{flex:1,padding:'11px 8px',textAlign:'center',background:'#eff6ff',border:'1.5px solid #2563eb',borderRadius:10,color:'#2563eb',fontWeight:700,fontSize:14,textDecoration:'none'}}>
                      👁 Preview
                    </a>
                    <a href={pdfDataUrl} download={`${(customer.name||'').trim().split(/\s+/).pop()}_${(customer.address||'').split(',')[0].trim().replace(/\s+/g,'_')}_${(jt.label||jobType).replace(/\s+/g,'_')}.pdf`}
                      style={{flex:1,padding:'11px 8px',textAlign:'center',background:'#f0fdf4',border:'1.5px solid #16a34a',borderRadius:10,color:'#16a34a',fontWeight:700,fontSize:14,textDecoration:'none'}}>
                      ⬇ Download
                    </a>
                  </div>
                  <div style={{marginBottom:10}}>
                    <label className="field-label">Send to (email)</label>
                    <input type="email" value={sendEmail} onChange={e=>setSendEmail(e.target.value)}
                      placeholder="customer@email.com"
                      style={{width:'100%',padding:'11px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:15,fontFamily:'inherit'}}
                    />
                  </div>
                  <div style={{marginBottom:10}}>
                    <label className="field-label">Personal note (optional)</label>
                    <textarea value={customMsg} onChange={e=>setCustomMsg(e.target.value)}

                      style={{width:'100%',padding:'11px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:14,fontFamily:'inherit',resize:'vertical'}}

                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                    <input type="checkbox" id="ccOffice" checked={ccOffice} onChange={e=>setCcOffice(e.target.checked)} style={{width:16,height:16,cursor:'pointer'}} />

                  </div>
                  {(sendStatus === 'error') && (
                    <div style={{padding:'10px 14px',borderRadius:10,background:'#fef2f2',border:'1.5px solid #fca5a5',color:'#dc2626',fontSize:14,marginBottom:10}}>{sendError}</div>
                  )}
                  {sendStatus === 'sent' && (
                    <div>
                      <div style={{padding:'10px 14px',borderRadius:10,background:'#f0fdf4',border:'1.5px solid #86efac',color:'#166534',fontSize:14,fontWeight:600,marginBottom:10}}>✅ Email sent successfully!</div>

                      {sendStatus === 'sending' ? '⏳ Sending…' : '📧 Send to Customer & Office'}
                    </button>

            </InnerCard>
          </div>
        </div>
        <div className="nav-bar">
          <button className="nav-btn-back" onClick={onBack}>+ Same Customer</button>
          <button className="nav-btn-primary" onClick={onHome}>⌂ Home</button>
        </div>
      </div>

  }

  // ── Main flow ────────────────────────────────────────────────────────────────
  return (
    <div id="app-inner">

        <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:8}} alt="" /></div>

          {/* ── Step 2: Review ─────────────────────────────────────────────── */}
          {step === 2 && <>
            <div>
              <div className="section-title">{jobType === 'system_recommendations' ? 'Review Recommendations' : 'Review & Submit'}</div>

            <InnerCard title="👤 Customer">

              <Row label="Address"     value={customer.address} />

              {customer.phone && <Row label="Phone"   value={customer.phone} />}

            {photos.length > 0 && (
              <InnerCard title={`📸 Photos (${photos.length})`}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>

                    <div key={p.id} style={{borderRadius:8,overflow:'hidden',border:'1px solid #e2e8f0'}}>
                      <img src={p.dataUrl} style={{width:'100%',height:66,objectFit:'cover',display:'block'}} alt="" />
                      {p.caption && <div style={{fontSize:10,color:'#64748b',padding:'3px 4px',background:'#f8fafc',textAlign:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.caption}</div>}

              <InnerCard title="🔩 Materials">

                  <Row key={item.product.id} label={`${item.product.name} × ${item.qty}`} value={`$${fmt(item.product.price*item.qty)}`} />

            {laborHours > 0 && (

            {(jobType === 'revamp' || jobType === 'system_recommendations') && (
              <InnerCard title="💲 Price Override (optional)">
                <div style={{fontSize:13,color:'#64748b',marginBottom:10}}>Leave blank to use the calculated price. If entered, the PDF will show item quantities only — no per-item pricing.</div>
                <input
                  type="number"
                  value={priceOverride}
                  onChange={e => setPriceOverride(e.target.value)}
                  placeholder={`Calculated: $${fmt(grandTotal)}`}
                  style={{width:'100%',padding:'12px 14px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:16,fontFamily:'inherit',boxSizing:'border-box'}}
                />
              </InnerCard>
            )}

            <div className="price-callout">
              <div>
                <div className="price-label">Grand Total</div>
                <div className="price-val">${fmt(effectiveTotal)}</div>
                <div className="price-note">{overrideApplies ? 'Price override applied' : 'Materials + Labor'}</div>
              </div>
              <span style={{fontSize:44}}>{jt.icon}</span>
            </div>
          </>}

        </div>
      </div>

      <div className="nav-bar">
        {step > 0
          ? <button className="nav-btn-back" onClick={()=>setStep(s=>s-1)}>← Back</button>
          : <button className="nav-btn-back" onClick={onBack}>← Customers</button>
        }
        {step < STEPS.length - 1
          ? <button className="nav-btn-primary" onClick={()=>setStep(s=>s+1)}>Continue →</button>
          : <button className="nav-btn-primary" disabled={saving} onClick={submit}>{saving?'⏳ Saving…':'✓ Submit Job'}</button>
        }
      </div>
    </div>
  );
}

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzNihd63pA6DrwLyOzIDh4mWBba_hOLOjROwk54ZlFN_0CN0Rbm9wGUciMV-4KlVd5oQ/exec';

// ── Job type config ───────────────────────────────────────────────────────────
const JOB_TYPES = [
  { id: 'new_installation',      label: 'New Installation',      icon: '🌱', color: '#1a3a6b', desc: 'Full system design & estimate' },
  { id: 'revamp',                label: 'Re-Vamp',                icon: '🔧', color: '#0284c7', desc: 'Larger scope project that needs Machine' },
  { id: 'service_call',          label: 'Service Call',           icon: '🛠', color: '#0f766e', desc: "Urgent calls that NEED to be done, but couldn't be done on initial visit. (URGENT)" },
  { id: 'system_recommendations',label: 'System Recommendations', icon: '💡', color: '#6d28d9', desc: 'Upgrades/Improvements/Potential Issues that tech sees, but customer doesn\'t. (blocked heads, WiFi upgrade, peened solenoids, etc.)' },
];

// ── EstimatesQueueScreen ──────────────────────────────────────────────────────
function EstimatesQueueScreen({ onBack, onStartEstimate }) {
  const cached = (() => { try { return JSON.parse(localStorage.getItem(QUEUE_CACHE_KEY) || '{}'); } catch(e) { return {}; } })();
  const [loading, setLoading] = useState(true);
  const [queue,   setQueue]   = useState(cached.queue || []);
  const [error,   setError]   = useState(null);
  const [lastUpdated, setLastUpdated] = useState(cached.ts || null);

  async function fetchQueue(attempt = 1) {
    try {
      const r = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'get_queue' }) });
      const data = await r.json();
      const q = data.queue || [];
      setQueue(q);
      setError(null);
      const ts = Date.now();
      setLastUpdated(ts);
      localStorage.setItem(QUEUE_CACHE_KEY, JSON.stringify({ queue: q, ts }));
    } catch(e) {
      if (attempt < 3) {
        setTimeout(() => fetchQueue(attempt + 1), attempt * 2500);
        return;
      }
      if (!cached.queue) setError('Could not load queue. Check your connection.');
    }
    setLoading(false);
  }

  useEffect(() => { fetchQueue(); }, []);

  function refresh() { setLoading(true); setError(null); fetchQueue(); }

  function formatAge(ts) {
    if (!ts) return '';
    const mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    if (mins < 60) return mins + ' mins ago';
    return Math.round(mins / 60) + 'h ago';
  }

  return (
    <div id="app-inner">
      <div className="brand">
        <div className="brand-icon"><img src="ToomeyLogo2026.png" style={{width:'100%',height:'100%',objectFit:'contain',borderRadius:8}} alt="" /></div>

// ── DashboardScreen ───────────────────────────────────────────────────────────
function DashboardScreen({ onBack }) {
  const [data,    setData]    = useState(null);
  const [loading, setLoading] = useState(true);
  const [preset,  setPreset]  = useState('month');

  const PRESETS = [
    { id:'today',     label:'Today' },
    { id:'week',      label:'7 Days' },
    { id:'month',     label:'Month' },
    { id:'year',      label:'Year' },
    { id:'all',       label:'All' },
  ];

  function getRange(p) {
    const now = new Date();
    const iso = d => d.toISOString().split('T')[0];
    if (p === 'today')     return { start: iso(now), end: iso(now) };
    if (p === 'week')      { const s = new Date(now); s.setDate(now.getDate()-6); return { start: iso(s), end: iso(now) }; }
    if (p === 'month')     return { start: iso(new Date(now.getFullYear(), now.getMonth(), 1)), end: iso(now) };
    if (p === 'year')      return { start: iso(new Date(now.getFullYear(), 0, 1)), end: iso(now) };
    return { start: '', end: '' };
  }

  async function load(p) {
    setPreset(p); setLoading(true);
    const { start, end } = getRange(p);
    const body = { action: 'get_dashboard' };
    if (start) body.fromDate = start;
    if (end)   body.toDate   = end;
    try {
      const r = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(body) });
      const d = await r.json();
      setData(d);
    } catch(e) { setData(null); }
    setLoading(false);
  }

  useEffect(() => { load('month'); }, []);

  const niSent      = data?.newInstalls?.sent     || 0;
  const niAccepted  = data?.newInstalls?.accepted || 0;
  const niRevenue   = data?.newInstalls?.revenue  || 0;
  const niCloseRate = niSent > 0 ? Math.round(niAccepted / niSent * 100) : 0;
  const niAvgValue  = niAccepted > 0 ? Math.round(niRevenue / niAccepted) : 0;
  const sc = data?.serviceCalls || {};

  const fmt$ = n => '$' + Math.round(n||0).toLocaleString();

  function Stat({ label, value, color }) {
    return (
      <div style={{background:'#f8fafc',borderRadius:12,padding:'12px 14px',border:'1.5px solid #e2e8f0',flex:1,minWidth:0}}>
